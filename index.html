<script>
const specimens=[
{id:'laozi',domain:'philosophy',icon:'✦',title:'Lead Without Loud',quote:'When the work is done, and things have gone well, the people say: we did it ourselves.',source:'Laozi · Dao De Jing · Chapter 17 · c. 4th century BCE',original:'功成事遂，百姓皆謂我自然。',summary:'The highest form of leadership makes agency appear inside other people.',context:'The Dao De Jing emerged from the Warring States period, when Chinese thinkers were responding to disorder, ambitious rulers, and the problem of governing without exhausting the people. Chapter 17 reverses the usual fantasy of power. The best ruler is not the most visible, dramatic, or feared. The best ruler creates conditions so well ordered that people experience success as their own.',teaches:'Mature influence designs the field so others can act with dignity and competence.',dos:['Remove one obstacle before giving advice.','Let others claim ownership of the win.','Design the condition, then step back.'],donts:['Do not make usefulness theatrical.','Do not confuse visibility with leadership.','Do not rescue people from learning agency.']},
{id:'dopamine',domain:'psychology',icon:'◐',title:'Reward Prediction Error',quote:'Dopamine neurons report an error in the prediction of reward.',source:'Wolfram Schultz, Peter Dayan, and P. Read Montague · A Neural Substrate of Prediction and Reward · Science · 1997',summary:'Motivation spikes when reality teaches the brain that the future may be better than expected.',context:'Schultz, Dayan, and Montague connected dopamine activity to reward prediction error: the gap between expected and received reward. Dopamine helps the organism update its model of the world. Unexpected reward increases dopamine activity; expected reward shifts the signal toward the cue; missing reward produces a dip.',teaches:'You are motivated by evidence that your model of reality is improving. Design progress so the mind can detect it.',dos:['Create one visible sign of progress.','Make improvement easy to detect.','Use small surprises to reinforce effort.'],donts:['Do not rely on vague future reward.','Do not hide progress inside abstraction.','Do not confuse stimulation with learning.']},
{id:'orwell',domain:'communication',icon:'( )',title:'Language as Moral Weather',quote:'But if thought corrupts language, language can also corrupt thought.',source:'George Orwell · Politics and the English Language · 1946',summary:'Imprecise language is not decoration. It is a condition that permits imprecise thought.',context:'Orwell wrote after watching political language become inflated, evasive, and morally anaesthetized. His target was language that hides agency: passive constructions, dead metaphors, abstractions, and phrases that make violence or stupidity sound administrative.',teaches:'When words blur, responsibility blurs. Precision refuses to let reality dissolve into atmosphere.',dos:['Name the actor, action, and consequence.','Replace vague phrases with precise nouns.','Use language that preserves responsibility.'],donts:['Do not hide agency in passive voice.','Do not use elegant fog to avoid truth.','Do not let abstractions do moral work.']},
{id:'drucker',domain:'leadership',icon:'△',title:'Effectiveness Can Be Learned',quote:'Intelligence, imagination, and knowledge are essential resources, but only effectiveness converts them into results.',source:'Peter F. Drucker · The Effective Executive · 1967',summary:'Capability becomes real only when organized into contribution.',context:'Drucker wrote for knowledge workers before the term became common culture. His central concern was not charisma but effectiveness: the learned discipline of directing time, attention, strengths, and decisions toward contribution.',teaches:'Your value is measured by what your understanding makes possible for others.',dos:['Define the contribution that matters today.','Protect time for the essential result.','Convert intelligence into usefulness.'],donts:['Do not confuse busyness with contribution.','Do not let noise set the agenda.','Do not perform competence without producing value.']},
{id:'socrates',domain:'philosophy',icon:'✦',title:'The Examined Life',quote:'The unexamined life is not worth living.',source:'Socrates in Plato · Apology · c. 399 BCE',summary:'Self-knowledge begins with refusing to inherit yourself unconsciously.',context:'In Plato’s Apology, Socrates speaks before an Athenian jury that will sentence him to death. His defense is philosophical: questioning and testing claims are necessary to a meaningful life.',teaches:'Intelligence becomes wisdom only when it turns back on the self.',dos:['Ask one question beneath your first answer.','Name one inherited assumption.','Let discomfort become evidence.'],donts:['Do not confuse confidence with truth.','Do not protect identity from examination.','Do not outsource judgment to the crowd.']},
{id:'milgram',domain:'psychology',icon:'◐',title:'The Authority Field',quote:'Ordinary people, simply doing their jobs, and without any particular hostility on their part, can become agents in a terrible destructive process.',source:'Stanley Milgram · Obedience to Authority · 1974',summary:'Behavior changes when responsibility is absorbed by a system.',context:'Milgram’s obedience experiments asked participants to administer what they believed were painful shocks when instructed by an authority figure. The studies remain ethically controversial, but their force endures: people can experience themselves as instruments of authority.',teaches:'Moral agency requires noticing when a system is borrowing your hands.',dos:['Name who is actually responsible.','Pause when authority accelerates action.','Separate role compliance from moral consent.'],donts:['Do not outsource judgment to hierarchy.','Do not let procedure erase conscience.','Do not confuse obedience with neutrality.']},
{id:'peck',domain:'communication',icon:'( )',title:'Listening as Risk',quote:'You cannot truly listen to anyone and do anything else at the same time.',source:'M. Scott Peck · The Road Less Traveled · 1978',summary:'Attention is the price of being changed by another person.',context:'Peck treats listening not as politeness but as disciplined surrender of competing agendas. True listening suspends rebuttal, diagnosis, and self-presentation long enough to receive another person’s structure of meaning.',teaches:'Most people need fewer simultaneous motives while another person is speaking.',dos:['Listen without preparing your rebuttal.','Repeat the structure of what you heard.','Let the other person finish.'],donts:['Do not multitask while pretending to listen.','Do not diagnose too early.','Do not use listening as a waiting room for your point.']},
{id:'sunzi',domain:'leadership',icon:'△',title:'Victory Before Battle',quote:'The victorious army first realizes the conditions for victory, and then seeks battle.',source:'Sunzi · The Art of War · c. 5th century BCE',original:'勝兵先勝而後求戰。',summary:'Strategy is the art of arranging conditions before action becomes visible.',context:'The Art of War values position, timing, terrain, morale, information, and asymmetry over heroic collision. The best strategist makes the fight unnecessary or already decided by the time it appears.',teaches:'The decisive move often happens upstream: framing, timing, terrain, incentives, and alliance.',dos:['Arrange conditions before forcing action.','Study timing and incentives.','Win upstream when possible.'],donts:['Do not confuse effort with strategy.','Do not enter conflict unpositioned.','Do not mistake drama for decisiveness.']}
];

const qs=[['learningAim','What are you sharpening first?',[['mind','My mind','psychology, behavior, attention, and self-knowledge'],['speech','My speech','clearer language, better listening, more elegant communication'],['judgment','My judgment','decision-making, strategy, leadership, and timing'],['spirit','My inner life','meaning, discipline, calm, and philosophical depth']]],['dailyMode','How should Sharper meet you?',[['quiet','Quietly','one precise idea, no noise'],['professor','Like a professor','context, sources, experiments, and intellectual scaffolding'],['coach','Like a private coach','small behavioral moves I can deploy today'],['museum','Like a museum','beautiful specimens I can return to and collect']]],['friction','What usually steals your attention?',[['scrolling','Scrolling','I leak time into feeds and fragments'],['overthinking','Overthinking','I circle decisions longer than needed'],['reactivity','Reactivity','I absorb other people’s urgency too quickly'],['vagueness','Vagueness','I need cleaner language, priorities, and follow-through']]]];
const adjs='Moonlit Velvet Wandering Quiet Lucid Silver Drowsy Astral Pearled Secret Ceremonial Nocturne Tender Oblique Luminous Severe Patient Hidden Glacial Amber Measured Solitary Electric Feral Blue Incense Sable Soft Vigilant Mercurial Lantern Porcelain Stormward Hushed Radial Tactile Golden Austere Wild Slow'.split(' '),cols=[['Aubergine','#A99BC0'],['Umber','#8D634B'],['Celadon','#A7B7A1'],['Saffron','#C8964D'],['Indigo','#8E95C7'],['Verdigris','#78A99C'],['Bordeaux','#8D4651'],['Ocher','#C09252'],['Graphite','#A7A39B'],['Ultramarine','#697FB1'],['Cinnabar','#B9563E'],['Malachite','#6C9B79'],['Lapis','#637EB7'],['Parchment','#D8CDB8'],['Viridian','#5F9B86'],['Alabaster','#DAD2C3'],['Madder','#9D4C55'],['Mauve','#B094AD'],['Sienna','#A56542'],['Prussian Blue','#64748F']];
const LS='sharp-v1',PROFILE='sharp-profile-v1',start=new Date('2026-05-25T00:00:00'),screen=document.getElementById('screen'),phone=document.getElementById('phone'),nav=document.getElementById('nav'),home=document.getElementById('home'),toast=document.getElementById('toast');let st={tab:'today',mode:'exhibition',query:'',detail:'',authorFilter:'',sim:0,...JSON.parse(localStorage.getItem(LS)||'{}')};st.saved=new Set(st.saved||[]);st.engaged=new Set(st.engaged||[1]);st.savedDay=st.savedDay||{};st.profile={complete:false,name:'',philosopher:'',learningAim:'',dailyMode:'',friction:'',...JSON.parse(localStorage.getItem(PROFILE)||'{}')};st.energy=st.energy||energy();if(st.profile.name)st.name=st.profile.name;if(!st.name)st.name='Woopie Marcus';
function save(){localStorage.setItem(LS,JSON.stringify({...st,saved:[...st.saved],engaged:[...st.engaged],profile:undefined}));localStorage.setItem(PROFILE,JSON.stringify(st.profile))}function rnd(n){return Math.floor(Math.random()*n)}function energy(){let a=adjs[rnd(adjs.length)],c=cols[rnd(cols.length)];return{text:a+' '+c[0],color:c[1]}}function day(){let d=new Date(),t=new Date(d.getFullYear(),d.getMonth(),d.getDate()),s=new Date(start.getFullYear(),start.getMonth(),start.getDate());return Math.max(1,Math.floor((t-s)/86400000)+1)+(st.sim||0)}function active(){return plans[(day()-1)%plans.length].map(id=>specimens.find(x=>x.id===id))}function esc(x){return String(x||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function first(){return(st.name||'Woopie').trim().split(/\s+/)[0]||'Woopie'}function show(x){toast.textContent=x;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}function clock(){let d=new Date();document.getElementById('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}clock();setInterval(clock,30000);function top(){return`<div class="top"><span class="spark">✦</span><span class="word">SHARPER</span><div class="progress"><i></i><i></i><i></i></div><span class="pagecount">Day ${day()}</span></div>`}function render(){phone.classList.toggle('dark',st.tab==='self');nav.classList.toggle('hidden',!st.profile.complete);home.classList.toggle('hidden',!st.profile.complete);if(!st.profile.complete)return onboarding();nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===st.tab));if(st.tab==='today')today();if(st.tab==='library')library();if(st.tab==='self')self();if(st.tab==='sharper')sharper()}nav.onclick=e=>{let b=e.target.closest('button[data-tab]');if(b){st.tab=b.dataset.tab;st.detail='';render()}};
function onboarding(){phone.classList.remove('dark');let step=st.obStep||1,body='';if(step===1)body=`<div class="obcard"><div class="mono spark" style="margin-bottom:16px">What should Sharper call you?</div><input class="obfield" id="obname" value="${esc(st.profile.name||st.name||'')}" placeholder="Your name"></div>`;else if(step===2)body=`<div class="obcard"><div class="mono spark" style="margin-bottom:12px">Choose your first philosophical gravity</div><div class="choices">${phil.map(p=>`<button class="choice ${st.profile.philosopher===p[0]?'sel':''}" data-phil="${p[0]}"><span class="qt">“${p[2]}”</span><span class="credit">${p[1]} · ${p[3]}</span></button>`).join('')}</div></div>`;else{let q=qs[step-3];body=`<div class="obcard"><div class="mono spark" style="margin-bottom:12px">${q[1]}</div><div class="choices">${q[2].map(o=>`<button class="choice ${st.profile[q[0]]===o[0]?'sel':''}" data-q="${q[0]}:${o[0]}"><span class="ct">${o[1]}</span><span class="cd">${o[2]}</span></button>`).join('')}</div></div>`}screen.innerHTML=`<div class="onboard"><div class="obtop"><span class="spark">✦</span><span class="mono">Sharper / First Entry · ${step} / 5</span></div><h1 class="obtitle">Build your<br>private canon.</h1><p class="obcopy">A short calibration before the first specimen. Sharper will remember your name, your intellectual gravity, and the kind of mind you want to train.</p>${body}<div class="obactions"><button class="pill" id="back">${step===1?'Later':'Back'}</button><button class="pill earth" id="next">${step===5?'Enter Sharper':'Continue'}</button></div></div>`;let name=document.getElementById('obname');if(name)name.oninput=e=>{st.profile.name=e.target.value;st.name=e.target.value};screen.querySelectorAll('[data-phil]').forEach(b=>b.onclick=()=>{st.profile.philosopher=b.dataset.phil;render()});screen.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{let[a,v]=b.dataset.q.split(':');st.profile[a]=v;render()});document.getElementById('back').onclick=()=>{if(step===1){st.profile.complete=true;st.profile.name=st.profile.name||st.name||'Woopie Marcus';st.name=st.profile.name;save();render()}else{st.obStep=step-1;render()}};document.getElementById('next').onclick=()=>{if(step===1&&!st.profile.name.trim())return show('Name first');if(step===2&&!st.profile.philosopher)return show('Choose one');if(step>=3&&!st.profile[qs[step-3][0]])return show('Choose one');if(step>=5){st.profile.complete=true;st.profile.name=st.profile.name.trim()||'Woopie Marcus';st.name=st.profile.name;save();render()}else{st.obStep=step+1;render()}}}
function today(){st.engaged.add(day());save();screen.innerHTML=top()+`<section class="today-section"><div class="orn">✦</div><div class="mono" style="margin-bottom:30px">Daily Specimens</div><h1 class="intro-title">Good evening,<br>${esc(first())}.</h1><p class="intro-copy">Four small readings.<br>Keep what sharpens the day.</p><div class="astro"><div><div class="ai">☉</div><div class="al">Sunrise</div><div class="av">05:47</div></div><div><div class="ai">☼</div><div class="al">Sunset</div><div class="av">20:16</div></div><div><div class="ai">◐</div><div class="al">Moon</div><div class="av">WAXING GIBBOUS</div></div></div><div class="mini">✦</div><div class="mono spark">Day ${day()} · ${st.engaged.size} days reclaimed</div></section>`+active().map(qcard).join('')+`<section class="today-close"><div class="orn">✦</div><h1 class="closing-title">That is today.</h1><p class="closing-copy">Save what returns. Let the rest pass.</p><button class="pill earth" onclick="st.tab='library';render()">Go to Library</button></section>`;screen.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>toggle(b.dataset.save,true))}function qcard(s){return`<article class="quote-card"><div class="qmeta"><div class="mono">${s.domain}</div><button class="heart" data-save="${s.id}">${st.saved.has(s.id)?'♥':'♡'}</button></div><div class="quote-mark">“</div><h2 class="today-quote">${s.quote}</h2><div class="source mono">${s.source}</div></article>`}
function pool(){return st.mode==='saved'?[...st.saved].filter(id=>day()-(st.savedDay[id]||day())<21).map(id=>specimens.find(s=>s.id===id)).filter(Boolean):active()}function cards(){let p=pool();if(st.authorFilter)p=p.filter(x=>author(x)===st.authorFilter);if(st.query&&!st.authorFilter){let q=st.query.toLowerCase();p=p.filter(x=>(x.title+x.quote+x.summary+x.source+x.domain).toLowerCase().includes(q))}return p}function author(s){return s.source.split('·')[0].trim()}function library(){if(st.detail)return detail();let cs=cards();screen.innerHTML=`<div class="section-head"><span class="spark">✦</span><span class="mono">Four Domains, One Mind</span></div><label class="search"><span class="muted">⌕</span><input id="search" value="${esc(st.query)}" placeholder="Search quote, author, idea..."><span class="spark">✦</span></label><div class="subtabs"><button class="mono ${st.mode==='exhibition'?'active':''}" data-mode="exhibition">Today’s Exhibit</button><button class="mono ${st.mode==='saved'?'active':''}" data-mode="saved">My Collection</button></div><p class="libintro">Four domains of wisdom: philosophy, psychology, leadership, and communication.</p><div class="domain-note">${st.mode==='saved'?'Saved cards from the last 21 days.':'Today’s four specimens, shown together.'}</div><div class="day-marker">Currently viewing day ${day()}</div>${st.authorFilter?`<div class="day-marker">Saved author · ${st.authorFilter} <button onclick="st.authorFilter='';st.query='';render()">clear</button></div>`:''}<div class="cards">${cs.length?cs.map(card).join(''):`<div class="info"><p>Nothing is here yet. Save one specimen and it becomes part of your collection.</p></div>`}</div><button class="editor" id="nextday">Go to Next Day</button>`;document.getElementById('search').oninput=e=>{st.query=e.target.value;st.authorFilter='';library()};screen.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{st.mode=b.dataset.mode;library()});screen.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{if(e.target.closest('button'))return;st.detail=b.dataset.open;library()});screen.querySelectorAll('[data-savecard]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggle(b.dataset.savecard,false);library()});document.getElementById('nextday').onclick=()=>{st.sim++;st.query='';st.authorFilter='';save();show('Next day');library()}}function card(s){return`<article class="card ${st.mode==='saved'?'compact':''}" data-open="${s.id}"><div class="card-icon">${s.icon}</div><div style="min-width:0"><h3 class="card-title">${s.title}</h3><p class="card-sub">${s.summary}</p>${s.original?`<button class="tiny" onclick="show('${s.original}')">文</button>`:''}</div><button class="heart" data-savecard="${s.id}">${st.saved.has(s.id)?'♥':'♡'}</button></article>`}
function detail(){let s=specimens.find(x=>x.id===st.detail)||active()[0],orig=st.orig===s.id;screen.innerHTML=`<div class="detail-head"><button class="mono" id="close">×</button><div style="text-align:center"><div class="mono">Specimen</div><div class="mono muted" style="margin-top:12px">${s.domain}</div></div><button class="heart" id="saveD">${st.saved.has(s.id)?'♥':'♡'}</button></div><div class="mono muted" style="margin-bottom:18px">Specimen</div><h1 class="detail-title">${s.title}</h1><p class="detail-subtitle">${s.summary}</p><div class="quote-mark">“</div><h2 class="today-quote" style="font-size:48px">${s.quote}</h2><div class="source mono">${s.source}</div><div class="reader-actions">${s.original?`<button class="pill" id="orig">${orig?'Hide Original':'Original Language'} 文</button>`:'<span></span>'}<button class="pill" id="copy">▣ Copy</button></div>${s.original?`<div class="original ${orig?'show':''}">${s.original}</div>`:''}${acc('▥','Historical Context',s.context)}${acc('✦','What It Teaches',s.teaches)}${deploy(s)}`;document.getElementById('close').onclick=()=>{st.detail='';library()};document.getElementById('saveD').onclick=()=>{toggle(s.id,false);detail()};if(document.getElementById('orig'))document.getElementById('orig').onclick=()=>{st.orig=orig?'':s.id;detail()};document.getElementById('copy').onclick=()=>copy(`${s.quote}\n— ${s.source}\n\nHistorical context: ${s.context}`)}function acc(i,t,b){return`<details class="acc"><summary><div class="teaching-icon">${i}</div><div class="mono">${t}</div><div>＋</div></summary><p class="acc-body">${b}</p></details>`}function deploy(s){return`<details class="acc"><summary><div class="teaching-icon">◎</div><div class="mono">Deploy Today</div><div>＋</div></summary><div class="acc-body"><div class="dosgrid"><div class="doscol"><b>Dos</b><ul>${s.dos.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="doscol"><b>Don’ts</b><ul>${s.donts.map(x=>`<li>${x}</li>`).join('')}</ul></div></div></div></details>`}
function self(){let a=savedAuthors();screen.innerHTML=`<div class="self-head"><div class="mono"><span class="spark">✦</span> Self / Observatory&nbsp;&nbsp; Days Reclaimed · ${st.engaged.size}</div></div><div class="name-row"><input class="name-input" id="name" value="${esc(st.name)}"><button class="profile-btn" id="profile">◎</button></div><div class="self-star">✦</div><section class="energy"><button class="pill earth" id="energy">What's my energy today?</button><div class="energy-name" style="color:${st.energy.color}">${st.energy.text}</div><div class="energy-note">Today’s lens, not a label.</div></section><div class="darkline"></div><p class="selfquote">You become what you repeatedly return to.</p><div class="darkline"></div><section><div class="self-section-title"><div class="mono">Attention Field</div><button class="mono">View Insights →</button></div>${attention()}</section><div class="darkline"></div><section><div class="self-section-title"><div class="mono">21-Day Rhythm</div><div class="mono">Days Engaged</div></div><div class="dots">${Array.from({length:21},(_,i)=>`<span class="dot ${st.engaged.has(day()-20+i)?'on':''}"></span>`).join('')}</div></section><div class="darkline"></div><section><div class="self-section-title"><div class="mono">Saved Authors</div></div>${a.length?a.map(([x,c])=>`<div class="author"><span class="nm">${x}</span><button data-author="${x}">${c} ${c===1?'time':'times'}</button></div>`).join(''):`<div class="author"><span class="nm">No saved authors yet</span><span class="muted">save one →</span></div>`}</section>${profileOverlay()}`;document.getElementById('name').oninput=e=>{st.name=e.target.value;st.profile.name=e.target.value;save()};document.getElementById('energy').onclick=()=>{st.energy=energy();save();self()};document.getElementById('profile').onclick=()=>{st.profileOpen=true;self()};screen.querySelectorAll('[data-author]').forEach(b=>b.onclick=()=>{st.authorFilter=b.dataset.author;st.query=st.authorFilter;st.mode='saved';st.tab='library';render()});let ov=document.getElementById('overlay');if(ov){ov.onclick=e=>{if(e.target===ov){st.profileOpen=false;self()}};document.getElementById('closeProfile').onclick=()=>{st.profileOpen=false;self()};document.getElementById('retake').onclick=()=>{st.profile.complete=false;st.obStep=1;st.profileOpen=false;save();render()}}}function attention(){let ids=[...st.saved,...active().map(x=>x.id)],c={philosophy:0,psychology:0,leadership:0,communication:0};ids.map(id=>specimens.find(s=>s.id===id)).filter(Boolean).forEach(s=>c[s.domain]++);let total=Math.max(1,Object.values(c).reduce((a,b)=>a+b,0));return[['✦','Philosophy','philosophy'],['◐','Psychology','psychology'],['△','Leadership','leadership'],['( )','Communication','communication']].map(x=>{let p=Math.round(c[x[2]]/total*100);return`<div class="attention-row"><div class="attention-label"><span>${x[0]}</span><span>${x[1]}</span></div><div class="bar"><div class="fill" style="width:${p}%"></div></div><div class="percent">${p}%</div></div>`}).join('')}function savedAuthors(){let m=new Map();[...st.saved].map(id=>specimens.find(s=>s.id===id)).filter(Boolean).forEach(s=>m.set(author(s),(m.get(author(s))||0)+1));return[...m.entries()].sort((a,b)=>b[1]-a[1])}function profileOverlay(){let p=phil.find(x=>x[0]===st.profile.philosopher);let qv=k=>{let q=qs.find(x=>x[0]===k),o=q?.[2].find(x=>x[0]===st.profile[k]);return o||['','—','']};return`<div class="overlay ${st.profileOpen?'show':''}" id="overlay"><div class="profile-card"><div class="pc-head"><div class="pc-title">Curator’s Note</div><button class="pc-title" id="closeProfile" style="font-size:28px">×</button></div><div class="fact"><span class="mono muted">Name</span><span class="value">${esc(st.name)}</span></div><div class="fact"><span class="mono muted">Favorite philosopher</span><span class="value">${p?p[1]:'—'}</span><span class="detail">${p?'“'+p[2]+'”<br>'+p[3]:''}</span></div><div class="fact"><span class="mono muted">Learning aim</span><span class="value">${qv('learningAim')[1]}</span><span class="detail">${qv('learningAim')[2]}</span></div><div class="fact"><span class="mono muted">Preferred mode</span><span class="value">${qv('dailyMode')[1]}</span><span class="detail">${qv('dailyMode')[2]}</span></div><div class="fact"><span class="mono muted">Attention friction</span><span class="value">${qv('friction')[1]}</span><span class="detail">${qv('friction')[2]}</span></div><button class="pill earth" id="retake">Retake first entry</button></div></div>`}
function sharper(){screen.innerHTML=`<section class="sharper-hero"><div class="spark" style="font-size:26px;margin-bottom:34px">✦</div><h1 class="sharper-title">Sharper</h1><p class="sharper-copy">A small museum for the mind: one carefully chosen specimen at a time, with context, source, and a practical move you can carry into the day.</p></section><div class="info"><div class="mono spark" style="margin-bottom:12px">What this is</div><h3>Not a feed.</h3><p>Sharper is built against doomscrolling. The daily view stays scarce so attention can deepen instead of scatter.</p></div><div class="info"><div class="mono spark" style="margin-bottom:12px">Four domains</div><h3>Philosophy, psychology, leadership, communication.</h3><p>Each specimen is selected to refine judgment, behavior, language, and self-knowledge across Western and Eastern traditions.</p></div><div class="info"><div class="mono spark" style="margin-bottom:12px">How to use it</div><h3>Read, save, return.</h3><p>Today is for encounter. Library is for collection. Self is for noticing the pattern of what keeps calling you back.</p></div><div class="designer"><div class="mono spark" style="margin-bottom:18px">Note from the designer · WWWD</div><p class="libintro">Sharper is designed as a small museum for the mind: one carefully chosen specimen at a time, with context, source, and a practical move you can carry into the day. It is built to replace the reflex of scrolling with the slower pleasure of becoming more precise.</p></div>`}function toggle(id,r){if(st.saved.has(id)){st.saved.delete(id);delete st.savedDay[id]}else{st.saved.add(id);st.savedDay[id]=day()}save();show(st.saved.has(id)?'Saved':'Removed');if(r)today()}function copy(t){navigator.clipboard&&navigator.clipboard.writeText(t);show('Copied')}render();
</script></body></html>
