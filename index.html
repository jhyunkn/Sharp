<section id="home" class="page active"><div class="hero"><div class="hero-inner"><div class="eyebrow" data-i="homeK">daily wisdom deck</div><h1 class="title">Sharper</h1><p class="copy" data-i="homeCopy">A quiet deck for turning old wisdom into one precise behavior today. Draw from philosophy, psychology, speech, leadership, and judgment.</p><div class="actions"><button class="solid" data-go="quiz" data-i="quizBtn">archetype quiz</button><button class="ghost" data-go="deck" data-i="deckBtn">enter the deck</button></div></div></div></section>

let lang=LS.get('sharper_lang','en'),step=0,answers=[],activeCat='all',drawn=[],flipped=[],positions=[];
const ui={en:{homeK:'daily wisdom deck',homeCopy:'A quiet deck for turning old wisdom into one precise behavior today. Draw from philosophy, psychology, speech, leadership, and judgment.',quizBtn:'archetype quiz',deckBtn:'enter the deck',quizTitle:'archetype quiz',deckTitle:'wisdom deck',shuffle:'shuffle',reset:'reset draw',drawnTitle:'drawn cards',archiveTitle:'archive',back:'back',next:'next',reveal:'reveal',save:'save reading',saved:'saved',emptyArchive:'Nothing saved yet. Save a reading after a full draw.',choose:'choose three cards · chosen cards stay in place',flip:'tap to reveal',reading:'reading of the day',conclusion:'conclusion of the draw',move:'make this move',dont:'do not feed this'},zh:{homeK:'每日智慧卡组',homeCopy:'一个安静的抽卡系统，把古老的判断转成今天可以执行的一步。从哲学、心理、表达、领导力与批判性思考中取一束光。',quizBtn:'原型测验',deckBtn:'进入卡组',quizTitle:'原型测验',deckTitle:'智慧卡组',shuffle:'洗牌',reset:'重抽',drawnTitle:'已抽之卡',archiveTitle:'存档',back:'返回',next:'下一步',reveal:'揭示',save:'保存解读',saved:'已保存',emptyArchive:'还没有保存内容。完成一次抽取后，可以保存今日解读。',choose:'选三张卡 · 被选中的卡会留在原位并变淡',flip:'轻触揭示',reading:'今日解读',conclusion:'抽取结论',move:'今天这样做',dont:'不要喂养这个'}};
const cats=['all','Psychology','Philosophy','Communication','Leadership','Critical Thinking'];
const catZh={'all':'全部','Psychology':'心理学','Philosophy':'哲学','Communication':'沟通','Leadership':'领导力','Critical Thinking':'批判性思考'};
const raw=[
['Psychology','the mirror','◐','Everything that irritates us about others can lead us to an understanding of ourselves.','C. G. Jung','c. 20th century','Projection is a returned image. Your reaction is also evidence.','Name the reaction before answering.','Do not confuse intensity with truth.','镜','荣格','投射是一面回来的镜子。你的反应同样是证据。','先说出自己的反应，再回应。','不要把强烈当成真实。'],
['Psychology','the loop','⌁','We are what we repeatedly do. Excellence, then, is not an act, but a habit.','Will Durant, after Aristotle','1926','The repeated act is already casting your future vote.','Repeat one small correct act today.','Do not worship a dramatic reset.','回环','杜兰特概括亚里士多德','重复的行为已经在替未来投票。','今天重复一个小而正确的动作。','不要迷信戏剧性的重新开始。'],
['Psychology','the wound','✶','Until you make the unconscious conscious, it will direct your life and you will call it fate.','Attributed to Jung','20th century','What feels inevitable may be an unnamed wound defending itself.','Ask what pain is choosing for you.','Do not call old fear destiny.','暗伤','荣格语境','你以为是命运的地方，可能只是旧伤在替你做决定。','问清楚：是谁的疼痛在做选择。','不要把旧恐惧称作命运。'],
['Psychology','the witness','◌','No man is free who is not master of himself.','Epictetus','c. 100 CE','Freedom begins when the observing self returns before impulse acts.','Create one breath of distance.','Do not obey the first impulse.','见证者','爱比克泰德','自由始于冲动前还有一个清醒的自己在场。','在行动前留一个呼吸。','不要服从第一个冲动。'],
['Psychology','the pattern','▱','Character is destiny.','Heraclitus','c. 500 BCE','Life is built by patterned tendencies under pressure.','Notice what repeats when stressed.','Do not treat repetition as accident.','纹理','赫拉克利特','命运常是压力下反复出现的性格纹路。','观察压力下重复什么。','不要把重复当偶然。'],
['Philosophy','the quiet flame','✦','He who knows others is wise; he who knows himself is enlightened.','Lao Tzu','c. 400 BCE','Wisdom that excludes the knower becomes performance.','Turn one judgment inward.','Do not use insight only outward.','静焰','老子','如果智慧只指向别人，它仍然只是表演。','把一个判断转向自己。','不要只用洞察审判别人。'],
['Philosophy','the stoic gate','△','You have power over your mind — not outside events.','Marcus Aurelius','c. 170 CE','The gate is between event and interpretation. Guard it.','Separate event from meaning.','Do not surrender the gate to circumstance.','斯多葛之门','马可·奥勒留','门在事件与解释之间。守住这道门。','把事件和意义拆开。','不要把解释权交给环境。'],
['Philosophy','the measure','◇','Man is the measure of all things.','Protagoras','c. 450 BCE','Every judgment reveals the instrument doing the measuring.','Inspect your standard before judging.','Do not hide behind false objectivity.','尺度','普罗泰戈拉','每一次判断，都暴露正在测量世界的那把尺。','先检查自己的尺度。','不要躲在虚假的客观后面。'],
['Philosophy','the cave','◐','The unexamined life is not worth living.','Socrates','399 BCE','Examination is escape from inherited shadows.','Question one borrowed assumption.','Do not mistake familiarity for truth.','洞穴','苏格拉底','审视是从继承来的影子中走出。','质疑一个继承来的前提。','不要把熟悉误认为真实。'],
['Philosophy','the river','⌁','No man ever steps in the same river twice.','Heraclitus','c. 500 BCE','Change is not interruption; it is reality showing its method.','Respond to what has changed.','Do not negotiate with yesterday.','河流','赫拉克利特','变化不是现实的打断，而是现实的方式。','回应已经变化的东西。','不要继续和昨天谈判。'],
['Communication','the listener','◎','Nature has given men one tongue but two ears.','Epictetus','c. 100 CE','Listening is tactical humility.','Ask one clarifying question.','Do not prepare your defense while they speak.','听者','爱比克泰德','倾听是一种有力量的谦逊。','先问一个澄清问题。','不要在别人说话时准备反击。'],
['Communication','the precise word','//','The beginning of wisdom is the definition of terms.','Socrates','5th century BCE','Many conflicts survive because the key word was never defined.','Define the word everyone is using.','Do not argue with fog.','定名','苏格拉底语境','很多冲突活着，是因为关键词从未被定义。','先定义大家使用的词。','不要和雾争论。'],
['Communication','the bridge','▱','Speak, that I may see you.','Attributed to Socrates','classical antiquity','Speech reveals the architecture of the mind.','Say the real premise plainly.','Do not decorate a hidden motive.','桥','苏格拉底语境','语言会显出一个人的内部建筑。','把真正的前提说清楚。','不要用漂亮话装饰隐藏动机。'],
['Communication','the silence','◌','Silence is a true friend who never betrays.','Confucius','c. 500 BCE','Not every truth grows stronger by being spoken early.','Wait one beat before speaking.','Do not fill discomfort with noise.','沉默','孔子语境','有些真话太早说出，反而失去力量。','开口前多等一拍。','不要用噪音填补不适。'],
['Communication','the echo','◇','Kind words can be short and easy to speak, but their echoes are truly endless.','Attributed to Mother Teresa','20th century','A reply can close a field or reopen it.','Preserve dignity in your answer.','Do not win by shrinking another person.','回声','德蕾莎修女语境','一句回应可以关闭一个场，也可以重新打开它。','用保留尊严的方式回应。','不要靠缩小别人来获胜。'],
['Leadership','the servant','◎','A leader is best when people barely know he exists.','Lao Tzu','c. 400 BCE','The highest leadership makes others more capable.','Remove one obstacle for someone.','Do not make the work orbit your ego.','隐领','老子','最高的领导让别人变得更能做事。','替一个人移开一个障碍。','不要让工作围绕你的自我旋转。'],
['Leadership','the warlord','△','The general who wins the battle makes many calculations before the battle is fought.','Sun Tzu','c. 500 BCE','Strategy happens before visibility.','Make the calculation before entering.','Do not confuse motion with strategy.','谋将','孙子','真正的胜负常在行动之前。','先完成计算，再进入场域。','不要把动作误认为策略。'],
['Leadership','the standard','✦','Waste no more time arguing what a good man should be. Be one.','Marcus Aurelius','c. 170 CE','Authority becomes real when it stops advertising itself.','Demonstrate the standard once.','Do not explain what conduct disproves.','准绳','马可·奥勒留','标准不靠解释成立，而靠行为显形。','今天示范一次标准。','不要解释你的行为正在否定的东西。'],
['Leadership','the burden','▱','Uneasy lies the head that wears a crown.','Shakespeare','1597','Leadership is exposure to consequences.','Name the consequence you own.','Do not borrow authority without burden.','王冠','莎士比亚','领导是对后果的暴露。','说清楚你承担的后果。','不要借权威却逃避重量。'],
['Leadership','the builder','◇','The superior man is modest in speech, but exceeds in actions.','Confucius','c. 500 BCE','Build more than you announce.','Deliver one concrete proof.','Do not inflate intention.','筑者','孔子','少说一点，多做出一点。','交付一个具体证明。','不要膨胀意图。'],
['Critical Thinking','the razor','//','Entities should not be multiplied beyond necessity.','Occam','c. 1320','Complexity can hide avoidance.','Remove one unnecessary variable.','Do not admire confusion.','剃刀','奥卡姆','复杂有时是在隐藏逃避。','删掉一个不必要的变量。','不要欣赏混乱。'],
['Critical Thinking','the skeptic','◐','Doubt is not a pleasant condition, but certainty is absurd.','Voltaire','1767','Doubt keeps thought alive.','State what would change your mind.','Do not confuse certainty with rigor.','怀疑者','伏尔泰','怀疑让思想保持活着。','说出什么证据会改变你的判断。','不要把确定感误认为严谨。'],
['Critical Thinking','the premise','△','The first principle is that you must not fool yourself.','Richard Feynman','1974','Self-deception borrows your own voice.','Audit your strongest assumption.','Do not protect a conclusion from evidence.','前提','费曼','自欺借用的是你自己的声音。','审查你最强的假设。','不要保护结论免受证据影响。'],
['Critical Thinking','the scale','◎','It is the mark of an educated mind to entertain a thought without accepting it.','Aristotle','c. 350 BCE','A strong mind can host an idea without surrendering.','Hold one opposing view fairly.','Do not caricature what threatens you.','天平','亚里士多德','成熟的心智能容纳观点而不立刻投降。','公平地容纳一个相反观点。','不要丑化威胁你的东西。'],
['Critical Thinking','the consequence','✶','The greatest enemy of knowledge is the illusion of knowledge.','Attributed to Stephen Hawking','20th century','The most dangerous ignorance arrives dressed as competence.','Ask what you may be missing.','Do not let fluency replace verification.','后果','霍金语境','最危险的无知常穿着熟练的衣服。','问自己可能漏掉什么。','不要让流畅代替核实。']
];
const cards=raw.map((r,i)=>({id:'c'+i,deck:r[0],name:r[1],icon:r[2],quote:r[3],author:r[4],year:r[5],hidden:r[6],do:r[7],dont:r[8],nameZh:r[9],authorZh:r[10],hiddenZh:r[11],doZh:r[12],dontZh:r[13]}));
const qs=[{q:'When pressure rises, what do you trust first?',zh:'压力升起时，你最先信任什么？',a:[['strategy','A map before movement.','先有地图，再有动作。'],['witness','A pause before reaction.','先停一拍，再回应。'],['builder','A concrete next step.','先做一个可见的动作。'],['speaker','A precise sentence.','先把话说准。']]},{q:'What usually saves you from confusion?',zh:'你通常靠什么走出混乱？',a:[['witness','Seeing my own pattern.','看见自己的模式。'],['strategy','Finding the hidden structure.','找到隐藏结构。'],['speaker','Naming the real issue.','命名真正的问题。'],['builder','Making proof through action.','用行动制造证据。']]},{q:'What do you most need to refine?',zh:'你最需要被打磨的是什么？',a:[['speaker','How I communicate under tension.','压力下的表达。'],['builder','How consistently I act.','行动的稳定性。'],['strategy','How I choose battles.','选择战场的能力。'],['witness','How I relate to my own reactions.','与自身反应的关系。']]}];
const arch={strategy:['The Warlord','谋略者','You read the field before entering it. Your edge is calculation without paralysis.','你在进入场域之前先读懂局势。你的优势是计算，但不要让计算变成迟疑。'],witness:['The Quiet Flame','照见者','You turn attention inward until reaction becomes information.','你把注意力转向内部，让反应变成信息。'],builder:['The Builder','筑成者','You convert thought into structure through repeated proof.','你通过重复的证据，把想法筑成结构。'],speaker:['The Bridge','通达者','You use language to reveal, connect, and clarify the field.','你用语言显影、连接并澄清场域。']};
function t(k){return ui[lang][k]||k}function toast(m){let x=$('#toast');x.textContent=m;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
function scrollToEl(sel){setTimeout(()=>{let el=$(sel);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},160)}
function applyLang(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';$('#langBtn').textContent=lang==='zh'?'EN':'中文';$$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$('#railHelp').textContent=t('choose');renderCats();renderQuiz();renderRail();renderSlots();renderReading();renderArchive()}
function go(p){$$('.page').forEach(x=>x.classList.toggle('active',x.id===p));$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===p));if(p==='archive')renderArchive();window.scrollTo({top:0,behavior:'instant'})}
$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$('#langBtn').onclick=()=>{lang=lang==='en'?'zh':'en';LS.set('sharper_lang',lang);applyLang()};
function renderQuiz(){let box=$('#quizBox');let result=LS.get('sharper_arch',null);if(result&&step>=qs.length){let a=arch[result];box.innerHTML=`<div class="reveal"><div class="eyebrow">${lang==='zh'?'你的原型':'your archetype'}</div><div class="arch-name">${lang==='zh'?a[1]:a[0]}</div><p class="copy">${lang==='zh'?a[3]:a[2]}</p><div class="actions"><button class="solid" data-go="deck">${t('deckBtn')}</button><button class="ghost" id="again">${lang==='zh'?'重新测验':'reassess'}</button></div></div>`;box.querySelector('[data-go]').onclick=()=>go('deck');$('#again').onclick=()=>{LS.set('sharper_arch',null);step=0;answers=[];renderQuiz()};return}let q=qs[step];box.innerHTML=`<div class="qtop"><span class="steps">${String(step+1).padStart(2,'0')} / ${String(qs.length).padStart(2,'0')}</span><span class="steps">Sharper</span></div><h3 class="question">${lang==='zh'?q.zh:q.q}</h3><div class="choices">${q.a.map(([v,en,zh])=>`<button class="choice ${answers[step]===v?'selected':''}" data-v="${v}"><b>${lang==='zh'?zh:en}</b><span>${v}</span></button>`).join('')}</div><div class="quiz-nav"><button class="ghost" id="qb" ${step===0?'disabled':''}>${t('back')}</button><button class="solid" id="qn" ${answers[step]?'':'disabled'}>${step===qs.length-1?t('reveal'):t('next')}</button></div>`;box.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{answers[step]=c.dataset.v;renderQuiz()});$('#qb').onclick=()=>{if(step>0){step--;renderQuiz()}};$('#qn').onclick=()=>{if(step<qs.length-1){step++;renderQuiz()}else{let scores={};answers.forEach(a=>scores[a]=(scores[a]||0)+1);let top=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];LS.set('sharper_arch',top);step=qs.length;renderQuiz()}}}
function renderCats(){let c=$('#categories');c.innerHTML=cats.map(x=>`<button class="cat ${activeCat===x?'active':''}" data-cat="${x}">${lang==='zh'?(catZh[x]||x):x}</button>`).join('');c.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;renderCats();renderRail()})}
function shufflePositions(){positions=cards.map(()=>({r:(Math.random()*12-6).toFixed(1)+'deg'}));renderRail()}
function filtered(){return cards.filter(c=>activeCat==='all'||c.deck===activeCat)}
function renderRail(){let rail=$('#rail');rail.innerHTML=filtered().map(c=>{let i=cards.indexOf(c),picked=drawn.includes(c.id);return `<button class="mini-card ${picked?'picked':''}" data-id="${c.id}" style="--r:${(positions[i]&&positions[i].r)||'0deg'}" ${picked?'disabled':''}><span class="backmark">sharper<br>·<br>wisdom</span></button>`}).join('');rail.querySelectorAll('.mini-card').forEach(b=>b.onclick=()=>pick(b.dataset.id))}
function pick(id){if(drawn.length>=3)return toast(lang==='zh'?'已经抽满三张':'three cards drawn');drawn.push(id);flipped.push(false);renderRail();renderSlots();if(drawn.length===3){toast(lang==='zh'?'轻触下方卡片揭示':'tap cards below to reveal');scrollToEl('.drawn')}}
function renderSlots(){let s=$('#slots');let names=['first card','second card','third card'],zh=['第一张','第二张','第三张'];s.innerHTML=[0,1,2].map(i=>{let id=drawn[i],c=cards.find(x=>x.id===id);if(!c)return `<div class="slot"><div class="slot-label">${lang==='zh'?zh[i]:names[i]}</div><div class="draw-card face-down"><span class="backmark">${lang==='zh'?'等待抽取':'waiting'}</span></div></div>`;if(!flipped[i])return `<div class="slot"><div class="slot-label">${lang==='zh'?zh[i]:names[i]}</div><button class="draw-card face-down" data-flip="${i}"><span class="backmark">${t('flip')}</span></button></div>`;return `<div class="slot"><div class="slot-label">${lang==='zh'?zh[i]:names[i]}</div><article class="draw-card"><div class="card-head"><span>${lang==='zh'?catZh[c.deck]:c.deck}</span><span>${c.icon}</span></div><div><div class="card-icon">${c.icon}</div><h4 class="card-name">${lang==='zh'?c.nameZh:c.name}</h4><p class="quote">“${c.quote}”</p></div><div class="source">${lang==='zh'?c.authorZh:c.author} · ${c.year}</div></article></div>`}).join('');s.querySelectorAll('[data-flip]').forEach(b=>b.onclick=()=>{flipped[+b.dataset.flip]=true;renderSlots();renderReading();if(flipped.every(Boolean))scrollToEl('#reading')});renderReading()}
function renderReading(){let box=$('#reading');if(drawn.length!==3||!flipped.every(Boolean)){box.classList.remove('show');return}let cs=drawn.map(id=>cards.find(c=>c.id===id));let conclusion=lang==='zh'?`${cs[0].hiddenZh} ${cs[1].hiddenZh} ${cs[2].hiddenZh} 合在一起，这次抽取说：先看见模式，再重开选择，最后用一个小而重复的动作改变故事。`:`${cs[0].hidden} ${cs[1].hidden} ${cs[2].hidden} Read together, the draw says this: notice the pattern, reopen the choice, and let one small repeated act begin rewriting the story.`;let mv=lang==='zh'?cs.map(c=>c.doZh).join(' · '):cs.map(c=>c.do).join(' · ');let dn=lang==='zh'?cs.map(c=>c.dontZh).join(' · '):cs.map(c=>c.dont).join(' · ');box.classList.add('show');box.innerHTML=`<div class="eyebrow">${t('reading')}</div><div class="reading-grid"><div><h3>${t('conclusion')}</h3><p>${conclusion}</p></div><div class="small"><h3>${t('move')}</h3><p>${mv}</p></div><div class="small"><h3>${t('dont')}</h3><p>${dn}</p></div></div><div class="actions" style="margin-top:22px"><button class="solid" id="saveReading">${t('save')}</button></div>`;$('#saveReading').onclick=()=>{let a=LS.get('sharper_archive',[]);a.unshift({date:new Date().toLocaleDateString(),cards:cs.map(c=>lang==='zh'?c.nameZh:c.name),text:conclusion});LS.set('sharper_archive',a.slice(0,30));toast(t('saved'))}}
function renderArchive(){let a=LS.get('sharper_archive',[]),box=$('#archiveBox');if(!a.length){box.innerHTML=`<div class="empty">${t('emptyArchive')}</div>`;return}box.innerHTML=`<div class="archive-grid">${a.map(x=>`<article class="archive-item"><h4>${x.date}</h4><p>${x.cards.join(' · ')}</p><p style="margin-top:10px">${x.text}</p></article>`).join('')}</div>`}
$('#shuffleBtn').onclick=()=>{if(drawn.length)return toast(lang==='zh'?'抽取后不可洗牌':'shuffle locks after first draw');shufflePositions()};$('#resetDrawBtn').onclick=()=>{drawn=[];flipped=[];renderRail();renderSlots();renderReading()};
shufflePositions();applyLang();go('home');
</script>
</body>
</html>
