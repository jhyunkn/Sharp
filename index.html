:root{--bone:#EFEAE0;--paper:#F7F3EB;--ink:#1A1714;--warm:#8B7E6E;--soft:rgba(201,191,173,.34);--earth:#A4502F;--serif:'Instrument Serif',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;--mono:'JetBrains Mono','SF Mono',monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0d0d0c;display:grid;place-items:center;padding:22px;color:var(--ink);font-family:var(--sans)}button,input{font:inherit}button{border:0;background:transparent;color:inherit;cursor:pointer}.phone{width:min(430px,100vw);height:min(900px,calc(100vh - 24px));min-height:760px;position:relative;overflow:hidden;border-radius:44px;background:var(--paper);box-shadow:0 24px 80px rgba(0,0,0,.42);isolation:isolate}.phone:before{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(rgba(40,30,20,.035) 1px,transparent 1.1px);background-size:7px 7px}.status{height:54px;padding:18px 30px 0;display:flex;justify-content:space-between;font-weight:600;font-size:14px}.screen{height:calc(100% - 54px);overflow:auto;padding:0 28px 116px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.mono{font:10px var(--mono);letter-spacing:.28em;text-transform:uppercase}.spark{color:var(--earth)}.muted{color:var(--warm)}.pill{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--soft);font:500 10px var(--mono);letter-spacing:.22em;text-transform:uppercase}.pill.earth{color:var(--earth);border-color:rgba(164,80,47,.42)}.nav{position:absolute;left:0;right:0;bottom:0;height:104px;z-index:50;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:8px 12px 20px;background:rgba(239,234,224,.88);border-top:1px solid var(--soft);backdrop-filter:blur(16px)}.nav.hidden,.home.hidden{display:none}.nav button{height:72px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;color:var(--warm)}.nav button.active{color:var(--ink)}.ico{font-size:22px}.lab{font:500 9px var(--mono);letter-spacing:.2em;text-transform:uppercase}.home{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:138px;height:5px;border-radius:999px;background:currentColor;z-index:60}.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(12px);opacity:0;background:rgba(26,23,20,.9);color:var(--bone);padding:10px 16px;border-radius:999px;font:10px var(--mono);letter-spacing:.22em;text-transform:uppercase;transition:.22s;z-index:99}.toast.show{opacity:1;transform:translateX(-50%)}.top{margin-top:12px;min-height:48px;display:flex;align-items:center;gap:14px;padding:0 18px;border:1px solid var(--soft);border-radius:999px;background:rgba(247,243,235,.74)}.word{font:500 12px var(--mono);letter-spacing:.34em}.progress{flex:1;display:flex;gap:8px}.progress i{height:2px;flex:1;background:currentColor;border-radius:2px}.pagecount{font:500 11px var(--mono);color:var(--warm)}.today-section,.today-close{min-height:62vh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:54px 0;border-bottom:1px solid var(--soft)}.today-primer{text-align:left;width:100%;max-width:320px;margin:0 auto}.today-date-line{font:10px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--warm)}.today-rule{height:1px;background:var(--soft);margin:16px 0 30px}.today-name{font:52px/.95 var(--serif);letter-spacing:-.035em;margin:0 0 18px;color:var(--ink)}.today-posture{font:21px/1.1 var(--serif);letter-spacing:-.015em;color:var(--earth);margin:0 0 34px}.today-prompt{font:22px/1.25 var(--serif);letter-spacing:-.015em;color:var(--ink);margin:0 0 34px}.domain-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin:0 0 34px}.domain-grid div{font:10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--warm);white-space:nowrap}.today-stat{text-align:left;font:10px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--earth)}.orn{color:var(--earth);font-size late-columns:44px 1fr 22px;gap:12px;align-items:center;padding:21px 0;cursor:pointer}.acc summary::-webkit-details-marker{display:none}.teaching-icon{color:var(--earth);font-size:24px;text-align:center}.acc-body{padding:0 0 22px 56px;margin:0;font:14px/1.55 var(--mono);letter-spacing:.015em}.dosgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.doscol{border:1px solid var(--soft);border-radius:18px;padding:14px;background:rgba(247,243,235,.38)}.doscol b{display:block;color:var(--earth);font:600 9px var(--mono);letter-spacing:.24em;text-transform:uppercase;margin-bottom:10px}.doscol ul{margin:0;padding-left:16px}.doscol li{font:12.5px/1.35 var(--mono);margin-bottom:8px}.self-head{margin:28px 0 22px;white-space:nowrap}.self-card{text-align:center;border-bottom:1px solid var(--soft);padding-bottom:26px}.self-name{font:54px/.9 var(--serif);letter-spacing:-.025em;margin:26px 0 8px}.self-handle{color:var(--warm);font:10px var(--mono);letter-spacing:.24em;text-transform:uppercase}.self-insight{border:1px solid var(--soft);border-radius:26px;background:rgba(247,243,235,.58);padding:18px 16px;margin:24px 0}.self-kicker{color:var(--earth);font:9px var(--mono);letter-spacing:.24em;text-transform:uppercase;margin-bottom:12px}.self-insight p{margin:0;font:22px/1.2 var(--serif)}.energy{text-align:center;border-bottom:1px solid var(--soft);padding:12px 0 28px}.energy-label{color:var(--warm);font:10px var(--mono);letter-spacing:.24em;text-transform:uppercase}.energy-name{margin:18px auto 14px;font:44px/.95 var(--serif);letter-spacing:-.035em;color:var(--earth)}.self-section-title{display:flex;justify-content:space-between;align-items:center;color:var(--warm);margin:28px 0 18px}.attention-row{display:grid;grid-template-columns:130px 1fr 42px;gap:12px;align-items:center;margin-bottom:15px}.attention-label{display:flex;gap:10px;align-items:center;color:var(--ink);font:10px var(--mono);letter-spacing:.22em;text-transform:uppercase}.bar{height:3px;background:var(--soft);border-radius:999px}.fill{height:100%;background:var(--earth);border-radius:999px}.percent{font:600 11px var(--mono);text-align:right}.dots{display:flex;justify-content:space-between;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--soft)}.dot.on{background:var(--earth)}.author{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--soft);padding:12px 0}.author .nm{font:21px var(--serif)}.author button{font:10px var(--mono);color:var(--warm);letter-spacing:.12em;text-transform:uppercase}.reset-row{margin-top:30px;padding-top:22px;border-top:1px solid var(--soft);display:flex;justify-content:center}.confirm{position:absolute;inset:0;z-index:100;display:grid;place-items:center;padding:28px;background:rgba(26,23,20,.52);backdrop-filter:blur(12px)}.confirm-card{width:100%;max-width:330px;border:1px solid var(--soft);border-radius:28px;background:var(--paper);padding:24px 20px;box-shadow:0 24px 80px rgba(0,0,0,.22)}.confirm-card h3{margin:0 0 14px;font:34px/.95 var(--serif)}.confirm-card p{margin:0 0 24px;color:var(--warm);font:13px/1.55 var(--mono);letter-spacing:.04em}.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.onboard{min-height:100%;padding:24px 2px 34px;display:flex;flex-direction:column}.obtop{display:flex;align-items:center;gap:14px;margin:4px 0 34px;color:var(--warm)}.obtop:after{content:"";height:1px;flex:1;background:var(--soft)}.obtitle{font:italic clamp(58px,15vw,74px)/.88 var(--serif);letter-spacing:-.035em;margin:0}.obcopy{color:var(--warm);font:italic 24px/1.28 var(--serif);max-width:330px}.obcard{border:1px solid var(--soft);border-radius:28px;background:rgba(247,243,235,.56);padding:24px 20px;margin-top:18px}.obfield{width:100%;min-height:54px;border:1px solid var(--soft);border-radius:999px;background:rgba(239,234,224,.32);padding:0 20px;outline:0;font:italic 28px var(--serif)}.choices{display:grid;gap:12px;margin-top:18px}.choice{width:100%;text-align:left;border:1px solid var(--soft);border-radius:22px;background:rgba(247,243,235,.48);padding:18px}.choice.sel{border-color:rgba(164,80,47,.68);background:rgba(164,80,47,.06)}.choice .qt{display:block;font:italic 27px/1.04 var(--serif);margin-bottom:12px}.choice .credit{display:block;color:var(--earth);font:9px/1.4 var(--mono);letter-spacing:.22em;text-transform:uppercase}.choice .ct{display:block;font:28px/1 var(--serif);margin-bottom:8px}.choice .cd{display:block;color:var(--warm);font:17px/1.25 var(--serif)}.obactions{margin-top:auto;display:flex;justify-content:space-between;gap:12px;padding-top:24px}.sharper-hero{min-height:280px;display:flex;flex-direction:column;justify-content:center;text-align:center;border-bottom:1px solid var(--soft);margin-bottom:26px}.sharper-title{font:italic 70px/.9 var(--serif);letter-spacing:-.04em;margin:0}.sharper-copy{margin:26px auto 0;max-width:330px;color:var(--warm);font:italic 24px/1.25 var(--serif)}.info{border:1px solid var(--soft);border-radius:24px;padding:22px 20px;margin-bottom:14px;background:rgba(247,243,235,.45)}.info h3{font:30px/1 var(--serif);margin:0 0 12px}.info p{color:var(--warm);font:18px/1.35 var(--serif);margin:0}.designer{margin-top:26px;padding-top:24px;border-top:1px solid var(--soft)}@media(max-width:420px){body{padding:0}.phone{width:100vw;height:100vh;min-height:100vh;border-radius:0}.screen{padding-left:24px;padding-right:24px}.today-name{font-size:46px}}

<main class="phone" id="phone"><div class="status"><div id="clock">00:00</div><div>◒ ▰</div></div><section class="screen" id="screen"></section><nav class="nav" id="nav"><button data-tab="today"><span class="ico">⌂</span><span class="lab">Today</span></button><button data-tab="gallery"><span class="ico">▥</span><span class="lab">Gallery</span></button><button data-tab="self"><span class="ico">♙</span><span class="lab">Self</span></button><button data-tab="sharper"><span class="ico">✦</span><span class="lab">Sharper</span></button></nav><div class="home" id="home"></div><div class="toast" id="toast">Saved</div></main>
<script>
const specimens=[{"id":"laozi17","domain":"philosophy","icon":"✦","title":"Lead Without Loud","quote":"When the work is done, and things have gone well, the people say: we did it ourselves.","source":"Laozi · Dao De Jing · Chapter 17","original":"功成事遂，百姓皆謂我自然。","summary":"The highest form of influence lets agency appear inside other people.","context":"A Daoist line about leadership at its quietest: influence becomes strongest when people experience their own agency rather than the leader’s display.","teaches":"Mature influence designs conditions so others can act with dignity and competence.","dos":["Remove one obstacle before giving advice.","Let others claim ownership of the win.","Design the condition, then step back."],"donts":["Do not make usefulness theatrical.","Do not confuse visibility with leadership.","Do not rescue people from learning agency."]},{"id":"socrates","domain":"philosophy","icon":"✦","title":"The Examined Life","quote":"The unexamined life is not worth living.","source":"Socrates in Plato · Apology · 399 BCE","summary":"Self-knowledge begins with refusing to inherit yourself unconsciously.","context":"Socrates defends questioning as a condition of meaningful life. The line survives because examination becomes a moral practice, not a hobby.","teaches":"Intelligence becomes wisdom only when it turns back on the self.","dos":["Ask one question beneath your first answer.","Name one inherited assumption.","Let discomfort become evidence."],"donts":["Do not confuse confidence with truth.","Do not protect identity from examination.","Do not outsource judgment to the crowd."]},{"id":"confuciuslearn","domain":"philosophy","icon":"✦","title":"Learning as Return","quote":"Is it not a pleasure, having learned something, to try it out at due intervals?","source":"Confucius · Analects · Book 1","original":"學而時習之，不亦說乎？","summary":"Learning becomes real when it returns into practice.","context":"The Analects opens by making learning a rhythm, not a possession. Knowledge becomes pleasurable when it returns into practice at the right time.","teaches":"A thought is not yours until it has changed an action.","dos":["Repeat one idea in practice today.","Return to something you learned before.","Let knowledge become rhythm."],"donts":["Do not collect insight without rehearsal.","Do not confuse recognition with understanding.","Do not rush past repetition."]},{"id":"plutarch","domain":"philosophy","icon":"✦","title":"Education as Fire","quote":"The mind is not a vessel to be filled, but a fire to be kindled.","source":"Attributed to Plutarch · classical tradition","summary":"The best learning awakens judgment rather than storing information.","context":"A classical image of education as ignition rather than storage. The best teacher does not fill the student; they awaken judgment.","teaches":"The point is not to accumulate more, but to become more alive to what matters.","dos":["Ask what this idea makes possible.","Turn one fact into a question.","Notice what wakes up your judgment."],"donts":["Do not mistake storage for formation.","Do not flatten learning into intake.","Do not wait for permission to think."]},{"id":"sunzi","domain":"leadership","icon":"△","title":"Victory Before Battle","quote":"The victorious first make victory possible, then seek battle.","source":"Sunzi · The Art of War · c. 5th century BCE","original":"勝兵先勝而後求戰。","summary":"Strategy arranges conditions before action becomes visible.","context":"Sunzi treats victory as an upstream condition. The visible contest matters less than timing, terrain, preparation, and restraint.","teaches":"The decisive move often happens before the meeting, conflict, or performance begins.","dos":["Arrange conditions before forcing action.","Study timing and incentives.","Win upstream when possible."],"donts":["Do not confuse effort with strategy.","Do not enter conflict unpositioned.","Do not mistake drama for decisiveness."]},{"id":"aristotle","domain":"leadership","icon":"△","title":"Learn by Doing","quote":"For the things we have to learn before we can do them, we learn by doing them.","source":"Aristotle · Nicomachean Ethics · Book II","summary":"Capability grows through enacted practice, not abstract permission.","context":"Aristotle places practice before mastery. Some knowledge cannot be understood from the outside; it becomes clear only through repeated action.","teaches":"The right action often has to precede the full confidence to act.","dos":["Choose one skill to rehearse today.","Let practice clarify the theory.","Make the next attempt smaller and real."],"donts":["Do not wait for total readiness.","Do not overthink what requires repetition.","Do not call avoidance preparation."]},{"id":"franklin","domain":"leadership","icon":"△","title":"For Want of a Nail","quote":"For want of a nail the shoe was lost.","source":"Benjamin Franklin · Poor Richard’s Almanack · 1758","summary":"Small neglected parts can govern large outcomes.","context":"Franklin’s proverb shows how tiny omissions scale into large failures. Reliability often depends on honoring the small hinge before it breaks.","teaches":"Leadership often means respecting the apparently minor detail before it becomes structural.","dos":["Find the small hinge in the system.","Repair one weak link early.","Treat maintenance as strategy."],"donts":["Do not dismiss details as beneath you.","Do not wait until weakness becomes visible.","Do not confuse scale with importance."]},{"id":"marcus","domain":"leadership","icon":"△","title":"Color of Thought","quote":"The soul becomes dyed with the color of its thoughts.","source":"Marcus Aurelius · Meditations · c. 170–180 CE","summary":"Repeated attention becomes temperament.","context":"Marcus writes as a ruler training himself against impulse, vanity, and fear. His private notes treat thought as a material force that stains conduct over time.","teaches":"What you rehearse internally becomes the atmosphere others meet externally.","dos":["Choose one thought worth repeating.","Interrupt a corrosive rehearsal.","Let attention become discipline."],"donts":["Do not feed thoughts you cannot afford to become.","Do not confuse mood with truth.","Do not let repetition go ungoverned."]},{"id":"james","domain":"psychology","icon":"◐","title":"What You Attend To","quote":"My experience is what I agree to attend to.","source":"William James · The Principles of Psychology · 1890","summary":"Attention does not merely observe life; it composes it.","context":"William James makes attention the material of experience. What you repeatedly attend to does not merely occupy the mind; it becomes the world you inhabit.","teaches":"To choose attention is to choose the shape of consciousness.","dos":["Name what has your attention.","Withdraw from one low-quality stimulus.","Give one worthy thing uninterrupted time."],"donts":["Do not let the loudest object become the truest.","Do not mistake availability for importance.","Do not spend attention without noticing."]},{"id":"pascal","domain":"psychology","icon":"◐","title":"The Quiet Room","quote":"All of humanity’s problems stem from the inability to sit quietly in a room alone.","source":"Blaise Pascal · Pensées · 1670","summary":"Diversion often protects us from the encounter with ourselves.","context":"Pascal diagnoses the human dependence on diversion. Sitting quietly becomes difficult because it removes the noise that protects us from ourselves.","teaches":"Restlessness can be a messenger; do not silence it too quickly.","dos":["Sit with one unsolved feeling for three minutes.","Notice the first escape impulse.","Let quiet reveal the real problem."],"donts":["Do not call every distraction relief.","Do not flee the first discomfort.","Do not confuse motion with progress."]},{"id":"epictetus","domain":"psychology","icon":"◐","title":"The View We Take","quote":"People are disturbed not by things, but by the views they take of them.","source":"Epictetus · Enchiridion · c. 125 CE","summary":"The event and the interpretation are not the same object.","context":"Epictetus separates event from judgment. The disturbance is often not the thing itself, but the interpretation that rushes in around it.","teaches":"Freedom begins in the gap between what happened and what you concluded.","dos":["Separate the fact from the story.","Write the event in one neutral sentence.","Choose the next judgment deliberately."],"donts":["Do not treat first interpretation as reality.","Do not decorate fear with certainty.","Do not argue with facts by changing labels."]},{"id":"montaigne","domain":"psychology","icon":"◐","title":"Matter of My Book","quote":"I am myself the matter of my book.","source":"Michel de Montaigne · Essays · 1580","summary":"The self can become a disciplined site of observation.","context":"Montaigne turns the self into a field of inquiry. His essays show that self-study can be rigorous without becoming fixed or final.","teaches":"To examine yourself well is not narcissism; it is material for judgment.","dos":["Observe one recurring pattern without theatrics.","Use yourself as evidence.","Write the behavior before judging it."],"donts":["Do not turn self-study into self-display.","Do not freeze yourself into a type.","Do not avoid evidence because it is personal."]},{"id":"names","domain":"communication","icon":"“","title":"Rectify the Names","quote":"If names are not correct, language will not be in accordance with the truth of things.","source":"Confucius · Analects · Book 13","summary":"Precision in language protects precision in conduct.","context":"Confucius links language to reality and conduct. When names are imprecise, responsibility and action begin to lose their shape.","teaches":"A badly named problem becomes badly handled work.","dos":["Name the actor, action, and consequence.","Replace one vague term with a precise one.","Ask what the thing should be called."],"donts":["Do not let language hide responsibility.","Do not use elegant fog.","Do not accept a false name for convenience."]},{"id":"zeno","domain":"communication","icon":"“","title":"The Two Ears","quote":"We have two ears and one mouth, that we may listen the more and talk the less.","source":"Zeno of Citium · ancient Stoic tradition","summary":"Listening is not silence; it is disciplined proportion.","context":"This Stoic saying turns anatomy into discipline: listen more than you speak, and let speech arrive after attention.","teaches":"Speech improves when it is preceded by enough reception.","dos":["Let the other person finish.","Repeat the structure before responding.","Leave one extra second before speaking."],"donts":["Do not prepare your rebuttal while listening.","Do not mistake silence for attention.","Do not crowd the exchange with yourself."]},{"id":"bacon","domain":"communication","icon":"“","title":"Half of Wisdom","quote":"A prudent question is one half of wisdom.","source":"Francis Bacon · The Advancement of Learning · 1605","summary":"The right question reorganizes the problem before the answer arrives.","context":"Bacon treats inquiry as part of wisdom. A well-formed question reduces confusion before the answer even begins.","teaches":"A precise question is a tool, not a preface.","dos":["Ask the question that changes the frame.","Remove one assumption from the question.","Make the question small enough to answer."],"donts":["Do not ask performative questions.","Do not hide a conclusion inside a question.","Do not ask broadly when precision is available."]},{"id":"silence","domain":"communication","icon":"“","title":"Use Fewer Words","quote":"Those who know do not speak; those who speak do not know.","source":"Laozi · Dao De Jing · Chapter 56","original":"知者不言，言者不知。","summary":"Speech can clarify, but it can also spend what silence preserves.","context":"Daoist restraint treats speech as something to be used sparingly. Silence can protect precision from performance.","teaches":"The strongest sentence may be the one you earn by not saying three weaker ones.","dos":["Delete one unnecessary sentence.","Let silence hold the room briefly.","Speak after the thought has formed."],"donts":["Do not confuse more words with more meaning.","Do not fill space to manage anxiety.","Do not spend language before it is ready."]}];

function safeParse(x,d){try{return JSON.parse(x)||d}catch(e){return d}}function save(){localStorage.setItem(LS,JSON.stringify({...st,saved:[...st.saved],engaged:[...st.engaged],profile:undefined}));localStorage.setItem(PK,JSON.stringify(st.profile))}function rnd(n){return Math.floor(Math.random()*n)}function makePosture(){let a=adjectives[rnd(adjectives.length)],c=colors[rnd(colors.length)];return{text:a+' '+c[0],adj:a,color:c[1]}}function setPosture(){st.energy=makePosture();save()}function day(){return Math.max(1,st.sim+1)}function todayDate(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function displayDate(){let d=new Date(),days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return `${days[d.getDay()]} · ${months[d.getMonth()]} ${String(d.getDate()).padStart(2,'0')}`.toUpperCase()}function greeting(){let h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}function hashSeed(str){let h=2166136261;for(let i=0;i<str.length;i++)h^=str.charCodeAt(i);return Math.abs(h)}function pickDaily(list,salt){let idx=hashSeed(todayDate()+salt+(st.energy?.text||''))%list.length;return list[idx]}function specimenById(id){return specimens.find(s=>s.id===id)}function todayItems(){return plans[(day()-1)%plans.length].map(specimenById).filter(Boolean)}function savedAuthors(){let map={};[...st.saved].map(specimenById).filter(Boolean).forEach(s=>{let a=s.source.split('·')[0].trim();map[a]=(map[a]||0)+1});return Object.entries(map).sort((a,b)=>b[1]-a[1])}function dailyFrame(){let lead=todayItems()[0]?.domain||'philosophy',p=postureFrames[st.energy?.adj]||'Protect the mind from the first easy distraction.',a=savedAuthors()[0];return [p,a?`Your library has been returning to ${a[0]}; test that thread today.`:pickDaily(domainFrames[lead]||domainFrames.philosophy,lead)].join(' ')}function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function first(){return(st.name||'Jun').trim().split(/\s+/)[0]||'Jun'}function show(x){toast.textContent=x;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}function clock(){let d=new Date();$('#clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}clock();setInterval(clock,30000);function bump(bucket,id){st.history[bucket]=st.history[bucket]||{};st.history[bucket][id]=(st.history[bucket][id]||0)+1;st.history.days[todayDate()]=true;save()}function domainCounts(bucket){let out={philosophy:0,leadership:0,psychology:0,communication:0};Object.keys(st.history[bucket]||{}).forEach(id=>{let s=specimenById(id);if(s)out[s.domain]+=st.history[bucket][id]});return out}function topKey(o){return Object.entries(o).sort((a,b)=>b[1]-a[1])[0]||['philosophy',0]}function engagedCount(){return [...st.engaged].filter(x=>x>=day()-20&&x<=day()).length}function picked(pool,k){return pool.find(x=>x[0]===st.profile[k])||pool[0]}function handleName(){return(st.name||'you').trim().toLowerCase().replace(/[^a-z0-9]+/g,'.').replace(/^\.|\.$/g,'')||'you'}
function topbar(){return `<div class="top"><span class="spark">✦</span><span class="word">SHARPER</span><div class="progress">${'<i></i>'.repeat(6)}</div><span class="pagecount">1 / 6</span></div>`}function render(){nav.classList.toggle('hidden',!st.profile.complete);home.classList.toggle('hidden',!st.profile.complete);if(!st.profile.complete)return onboarding();nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===st.tab));if(st.tab==='today')today();if(st.tab==='gallery')gallery();if(st.tab==='self')self();if(st.tab==='sharper')sharper()}nav.addEventListener('click',e=>{let b=e.target.closest('button[data-tab]');if(!b)return;st.tab=b.dataset.tab;st.detail='';render()});
function onboarding(){let step=st.obStep||1,body='';if(step===1)body=`<div class="obcard"><div class="mono spark" style="margin-bottom:16px">Curate the mind / for modern life.</div><p class="obcopy" style="margin-top:0">Ancient wisdom, daily use. Practical wisdom shaped for you.</p><input class="obfield" id="obname" value="${esc(st.profile.name||st.name)}" placeholder="Your name"></div>`;else if(step===2)body=`<div class="obcard"><div class="mono spark" style="margin-bottom:12px">Choose your first philosophical gravity</div><div class="choices">${phil.map(p=>`<button class="choice ${st.profile.philosopher===p[0]?'sel':''}" data-phil="${p[0]}"><span class="qt">“${p[2]}”</span><span class="credit">${p[1]} · ${p[3]}</span></button>`).join('')}</div></div>`;else if(step===3)body=`<div class="obcard"><div class="mono spark" style="margin-bottom:12px">Choose your psychological lens</div><div class="choices">${psych.map(p=>`<button class="choice ${st.profile.psychology===p[0]?'sel':''}" data-psych="${p[0]}"><span class="qt">“${p[2]}”</span><span class="credit">${p[1]} · ${p[3]}</span></button>`).join('')}</div></div>`;else{let q=qs[step-4];body=`<div class="obcard"><div class="mono spark" style="margin-bottom:12px">${q[1]}</div><div class="choices">${q[2].map(c=>`<button class="choice ${st.profile[q[0]]===c[0]?'sel':''}" data-q="${q[0]}" data-v="${c[0]}"><span class="ct">${c[1]}</span><span class="cd">${c[2]}</span></button>`).join('')}</div></div>`}screen.innerHTML=`<div class="onboard"><div class="obtop"><span class="spark">✦</span><span class="mono">Sharper</span></div><h1 class="obtitle">${step===1?'Small museum for the mind.':step===2?'Who sharpens your judgment?':step===3?'How do you read yourself?':step===4?'What should become sharper?':'Where does attention leak?'}</h1>${body}<div class="obactions"><button class="pill" id="backOb">${step>1?'Back':''}</button><button class="pill earth" id="nextOb">${step===5?'Enter':'Continue'}</button></div></div>`;let n=$('#obname function today(){st.engaged.add(day());save();screen.innerHTML=topbar()+`<section class="today-section"><div class="today-primer"><div class="today-date-line">${displayDate()}</div><div class="today-rule"></div><h1 class="today-name">${greeting()}, ${esc(first())}.</h1><p class="today-posture">${st.energy?.text||'Daily'} posture.</p><p class="today-prompt">${dailyFrame()}</p><div class="domain-grid"><div>✦ Philosophy</div><div>△ Leadership</div><div>◐ Psychology</div><div>“ Communication</div></div><div class="today-stat">${st.engaged.size} days reclaimed</div></div></section>${todayItems().map((s,i)=>quoteCard(s,i+2)).join('')}<section class="today-close"><div class="orn">✦</div><h1 class="closing-title">That is today.</h1><p class="closing-copy">Save what returns. Let the rest pass.</p><div class="mini">✦</div><div class="mono spark">${todayDate()} · ${st.engaged.size} days reclaimed</div><button class="pill earth" id="goGallery" style="margin-top:34px">Go to Gallery</button></section>`;todayItems().forEach(s=>{let h=$('#save-'+s.id);if(h)h.onclick=()=>toggleSave(s.id)});$('#goGallery').onclick=()=>{st.tab='gallery';render()}}function quoteCard(s,n){return `<section class="quote-card"><div class="qmeta"><span class="mono">${String(n).padStart(2,'0')} · ${s.domain}</span><button class="heart" id="save-${s.id}">${st.saved.has(s.id)?'♥':'♡'}</button></div><div class="quote-mark">“</div><h2 class="today-quote">${s.quote}</h2><div class="source mono">${s.source}</div></section>`}function toggleSave(id){let was=st.saved.has(id);if(was){st.saved.delete(id);show('Removed')}else{st.saved.add(id);bump('saved',id);show('Saved')}save();render()}
function filteredCards(){let q=(st.query||'').toLowerCase(),items=(st.mode==='collection'?[...st.saved].map(specimenById).filter(Boolean):todayItems());if(q)items=items.filter(s=>(s.title+s.quote+s.source+s.summary+s.domain).toLowerCase().includes(q));return items}function gallery(){if(st.detail)return detail();let cs=filteredCards(),maxPreview=Math.max(1,Math.floor(specimens.length/4)),cap=st.sim>=maxPreview-1;screen.innerHTML=`<div class="section-head"><span class="spark">✦</span><span class="mono">Gallery</span></div><label class="search"><span class="muted">⌕</span><input id="search" value="${esc(st.query)}" placeholder="Search quote, author, idea..."><span class="spark">✦</span></label><div class="subtabs"><button class="${st.mode==='exhibition'?'active':''}" id="mEx">Today’s Exhibit</button><button class="${st.mode==='collection'?'active':''}" id="mCo">My Collection</button></div><p class="libintro">${st.mode==='collection'?'Saved specimens, arranged as a personal library.':'A quiet gallery of today’s four specimens.'}</p><div class="day-marker">Currently viewing day ${day()} / ${maxPreview}</div><div class="cards" id="cards">${cardsHTML(cs)}</div><button class="editor" id="nextDay">${cap?'Curated set complete':'Go to Next Day'}</button>`;let search=$('#search');if(search)search.oninput=e=>{st.query=e.target.value;renderGalleryCards()};$('#mEx').onclick=()=>{st.mode='exhibition';st.query='';gallery()};$('#mCo').onclick=()=>{st.mode='collection';st.query='';gallery()};$('#nextDay').onclick=()=>{if(cap)return show('Curated set complete');st.sim++;st.mode='exhibition';st.query='';save();gallery()};bindCards()}function cardsHTML(cs){return cs.length?cs.map(s=>`<button class="card" data-id="${s.id}"><div class="card-icon">${s.icon}</div><div><h3 class="card-title">${s.title}</h3><p class="card-sub">${s.quote}</p></div><div class="tiny">${st.saved.has(s.id)?'♥':'→'}</div></button>`).join(''):`<p class="libintro">Nothing here yet.</p>`}function renderGalleryCards(){$('#cards').innerHTML=cardsHTML(filteredCards());bindCards()}function bindCards(){screen.querySelectorAll('.card[data-id]').forEach(b=>b.onclick=()=>{st.detail=b.dataset.id;save();detail()})}
function detail(){let s=specimenById(st.detail)||todayItems()[0],orig=st.orig===s.id;bump('opened',s.id);screen.innerHTML=`<div class="detail-head"><button class="mono" id="close">×</button><div style="text-align:center"><div class="mono">Specimen</div><div class="mono muted" style="margin-top:12px">${s.domain}</div></div><button class="heart" id="saveD">${st.saved.has(s.id)?'♥':'♡'}</button></div><div class="mono muted" style="margin-bottom:18px">Specimen</div><h1 class="detail-title">${s.title}</h1><p class="detail-subtitle">${s.summary}</p><div class="quote-mark">“</div><h2 id="quoteToggle" class="today-quote ${s.original?'quote-toggle':''} ${orig?'showing':''}" style="font-size:48px">${orig&&s.original?s.original:s.quote}</h2>${orig&&s.original?'<span class="original-label">(original text)</span>':''}<div class="source mono">${s.source}</div><div class="reader-actions"><button class="pill" id="copy">▣ Copy</button></div><details class="acc" open><summary><div class="teaching-icon">⌁</div><div class="mono">Historical Context</div><div>＋</div></summary><p class="acc-body">${s.context}</p></details><details class="acc"><summary><div class="teaching-icon">◐</div><div class="mono">What It Teaches</div><div>＋</div></summary><p class="acc-body">${s.teaches}</p></details><details class="acc" id="deploy"><summary><div class="teaching-icon">✓</div><div class="mono">Deploy Today</div><div>＋</div></summary><div class="acc-body dosgrid"><div class="doscol"><b>Do</b><ul>${s.dos.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="doscol"><b>Do not</b><ul>${s.donts.map(x=>`<li>${x}</li>`).join('')}</ul></div></div></details>`;$('#close').onclick=()=>{st.detail='';save();gallery()};$('#saveD').onclick=()=>toggleSave(s.id);let qt=$('#quoteToggle');if(qt&&s.original)qt.onclick=()=>{st.orig=orig?'':s.id;detail()};$('#copy').onclick=()=>{navigator.clipboard?.writeText(`${s.quote}\n— ${s.source}`);show('Copied')};$('#deploy').addEventListener('toggle',e=>{if(e.target.open)bump('practiced',s.id)},{once:true})}
function selfPortrait(){let p=picked(phil,'philosopher'),y=picked(psych,'psychology'),opened=domainCounts('opened'),saved=domainCounts('saved'),practiced=domainCounts('practiced'),topOpened=topKey(opened),topSaved=topKey(saved),lowPractice=Object.entries(practiced).sort((a,b)=>a[1]-b[1])[0]||['communication',0],days=st.engaged.size;if(days<3)return `A ${p[1]}-leaning reader with a ${y[1]} lens. Sharper is beginning to learn what you save, open, and practice.`;if(days<30)return `You are forming a pattern around ${topOpened[0]} and saving most in ${topSaved[0]}. Your weakest practice signal today is ${lowPractice[0]}; the app reads this as an unfinished muscle, not a flaw.`;return `You are drawn to ${topSaved[0]} more than ${lowPractice[0]}. You are turning attention into a practical self-portrait.`}function self(){let a=savedAuthors();screen.innerHTML=`<div class="self-head"><div class="mono"><span class="spark">✦</span> Curator’s Profile</div></div><section class="self-card"><h1 class="self-name">${esc(st.name||'Jun')}</h1><div class="self-handle">@${handleName()}</div></section><div class="self-insight"><div class="self-kicker">Interpretation</div><p>${selfPortrait()}</p></div><section class="energy"><div class="energy-label">Daily posture</div><div class="energy-name">${st.energy.text} posture</div><button class="pill earth" id="energyBtn">Reposition</button></section><section><div class="self-section-title"><div class="mono">Attention Field</div></div>${attentionBars()}</section><section><div class="self-section-title"><div class="mono">21-Day Rhythm</div><div class="mono">${engagedCount()} / 21 engaged</div></div><div class="dots">${Array.from({length:21},(_,i)=>`<span class="dot ${i<engagedCount()?'on':''}"></span>`).join('')}</div></section><section><div class="self-section-title"><div class="mono">Saved Authors</div></div>${a.length?a.slice(0,5).map(x=>`<div class="author"><span class="nm">${x[0]}</span><button>${x[1]} saved</button></div>`).join(''):'<p class="libintro">Save specimens to form a visible pattern.</p>'}</section><div class="reset-row"><button class="pill" id="resetBtn">Reset</button></div>${st.resetOpen?resetConfirm():''}`;$('#energyBtn').onclick=()=>{setPosture();self()};$('#resetBtn').onclick=()=>{st.resetOpen=true;self()};let no=$('#resetNo');if(no)no.onclick=()=>{st.resetOpen=false;self()};let yes=$('#resetYes');if(yes)yes.onclick=()=>resetAll()}function attentionBars(){let c=domainCounts('opened'),total=Math.max(1,Object.values(c).reduce((a,b)=>a+b,0));return ['philosophy','leadership','psychology','communication'].map(d=>{let pct=Math.round(c[d]/total*100),icon={philosophy:'✦',leadership:'△',psychology:'◐',communication:'“'}[d];return `<div class="attention-row"><div class="attention-label"><span>${icon}</span>${d}</div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="percent">${pct}%</div></div>`}).join('')}function resetConfirm(){return `<div class="confirm"><div class="confirm-card"><h3>Reset thinker’s profile?</h3><p>This will delete all saved data, reading history, rhythm, and profile choices. No goes back. Yes clears everything and restarts at the landing page.</p><div class="confirm-actions"><button class="pill" id="resetNo">No</button><button class="pill earth" id="resetYes">Yes</button></div></div></div>`}function resetAll(){localStorage.removeItem(LS);localStorage.removeItem(PK);st={tab:'today',mode:'exhibition',query:'',detail:'',sim:0,obStep:1,resetOpen:false};st.saved=new Set();st.engaged=new Set();st.history={opened:{},saved:{},practiced:{},days:{}};st.profile={complete:false,name:'',philosopher:'',psychology:'',learningAim:'',friction:''};st.energy=makePosture();st.name='';render()}
function sharper(){screen.innerHTML=`<section class="sharper-hero"><div class="spark">✦</div><h1 class="sharper-title">Sharper</h1><p class="sharper-copy">A small museum for the mind: one carefully chosen specimen at a time.</p></section><div class="info"><div class="mono spark" style="margin-bottom:12px">Version</div><h3>Sharper Beta · v0.11</h3><p>This deployed prototype includes the daily specimen flow, Gallery, saved cards, resettable Self profile, behavioral interpretation, and a curated four-day no-repeat exhibition set.</p></div><div class="info"><div class="mono spark" style="margin-bottom:12px">Living library</div><h3>Wisdom is not limited to a few thinkers.</h3><p>The current prototype begins with a small verified set, but the product architecture is meant to grow into an expansive, multilingual library: ancient, modern, global, practical, and continuously curated.</p></div><div class="designer"><div class="mono spark" style="margin-bottom:12px">Note from designer</div><p class="libintro">Sharper is designed to replace the reflex of scrolling with the slower pleasure of becoming more precise.</p></div>`}function runTests(){console.assert(specimens.length>=16,'curated specimen set exists');console.assert(todayItems().length===4,'today has four specimens');console.assert(!dailyFrame().includes('Four specimens. Keep what sharpens the day.'),'daily frame is dynamic');console.assert(!specimens.some(s=>/copyright|copyrighted/i.test(s.context)),'contexts avoid backend copyright language');console.assert(typeof resetAll==='function','reset function exists')}runTests();render();
