<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sharper · wisdom cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #f2ece0;
  --cream-deep: #e8dfc8;
  --black: #18150f;
  --gold: #9a7818;
  --shadow: #6a5538;
  --border: 1.5px solid var(--shadow);
  --radius: 4px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  background-color: var(--cream);
  background-image: radial-gradient(var(--cream-deep) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--black);
  font-family: 'Space Mono', monospace;
  min-height: 100vh;
}
.topbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  height: 52px;
  background: rgba(242,236,224,0.92);
  backdrop-filter: blur(6px);
  border-bottom: var(--border);
}
.logo {
  font-family: 'IM Fell English', serif;
  font-size: 1.1rem;
  cursor: pointer;
  letter-spacing: 0.02em;
  color: var(--black);
  text-decoration: none;
}
.nav { display: flex; gap: 4px; }
.nav-btn {
  background: none; border: none; cursor: pointer;
  font-family: 'Space Mono', monospace; font-size: 0.7rem;
  color: var(--shadow); padding: 6px 12px;
  text-transform: uppercase; letter-spacing: 0.1em;
  border-radius: var(--radius);
  transition: color 0.2s, background 0.2s;
}
.nav-btn:hover { color: var(--black); background: var(--cream-deep); }
.nav-btn.on { color: var(--black); border-bottom: 2px solid var(--gold); }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.lang-btn {
  background: none; border: var(--border); cursor: pointer;
  font-family: 'Space Mono', monospace; font-size: 0.65rem;
  color: var(--shadow); padding: 4px 10px;
  border-radius: var(--radius);
  transition: all 0.2s;
}
.lang-btn:hover { color: var(--gold); border-color: var(--gold); }
.reassess-btn {
  background: none; border: none; cursor: pointer;
  font-family: 'Space Mono', monospace; font-size: 0.6rem;
  color: var(--shadow); padding: 4px 8px;
  text-decoration: underline;
}
.screen { display: none; }
.screen.on { display: block; }
main { max-width: 860px; margin: 0 auto; padding: 40px 24px 80px; }

/* LANDING */
.landing-hero {
  text-align: center; padding: 80px 0 60px;
}
.landing-title {
  font-family: 'IM Fell English', serif;
  font-size: 3.2rem; font-weight: 400;
  letter-spacing: -0.01em; margin-bottom: 16px;
}
.landing-sub {
  font-size: 0.72rem; letter-spacing: 0.15em;
  text-transform: uppercase; color: var(--shadow);
  margin-bottom: 48px;
}
.archetype-preview {
  display: inline-block;
  border: var(--border); padding: 24px 40px;
  margin-bottom: 32px; text-align: center;
  background: rgba(255,255,255,0.4);
}
.arch-glyph { font-size: 2rem; margin-bottom: 8px; }
.arch-name {
  font-family: 'IM Fell English', serif;
  font-size: 1.1rem; color: var(--gold);
  margin-bottom: 6px;
}
.arch-traits { font-size: 0.65rem; letter-spacing: 0.12em; color: var(--shadow); text-transform: uppercase; }
.cta-btn {
  display: inline-block;
  border: var(--border); background: var(--black);
  color: var(--cream); cursor: pointer;
  font-family: 'Space Mono', monospace; font-size: 0.75rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 14px 36px; border-radius: var(--radius);
  transition: all 0.2s;
}
.cta-btn:hover { background: var(--shadow); }
.cta-btn.secondary {
  background: none; color: var(--black);
  margin-left: 12px;
}
.cta-btn.secondary:hover { background: var(--cream-deep); }

/* QUIZ */
.quiz-wrap { max-width: 540px; margin: 0 auto; padding: 48px 0; }
.quiz-title {
  font-family: 'IM Fell English', serif;
  font-size: 1.5rem; margin-bottom: 8px;
}
.quiz-progress { font-size: 0.65rem; color: var(--shadow); letter-spacing: 0.1em; margin-bottom: 40px; }
.quiz-q {
  font-family: 'IM Fell English', serif;
  font-size: 1.1rem; font-style: italic;
  margin-bottom: 28px; line-height: 1.6;
}
.quiz-opts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }
.quiz-opt {
  border: var(--border); padding: 14px 20px;
  cursor: pointer; font-size: 0.8rem;
  background: rgba(255,255,255,0.4);
  border-radius: var(--radius); transition: all 0.15s;
  text-align: left;
}
.quiz-opt:hover { background: var(--cream-deep); border-color: var(--gold); }
.quiz-opt.sel { background: var(--black); color: var(--cream); border-color: var(--black); }
.quiz-nav { display: flex; gap: 12px; }
.quiz-nav-btn {
  border: var(--border); padding: 10px 24px;
  cursor: pointer; font-family: 'Space Mono', monospace;
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em;
  background: none; border-radius: var(--radius); transition: all 0.15s;
}
.quiz-nav-btn:hover { background: var(--cream-deep); }
.quiz-nav-btn.primary { background: var(--black); color: var(--cream); border-color: var(--black); }
.quiz-nav-btn.primary:hover { background: var(--shadow); }

/* ARCHETYPE RESULT */
.arch-result { text-align: center; padding: 60px 0; max-width: 480px; margin: 0 auto; }
.arch-result-glyph { font-size: 3rem; margin-bottom: 16px; }
.arch-result-label { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--shadow); margin-bottom: 8px; }
.arch-result-name { font-family: 'IM Fell English', serif; font-size: 2rem; color: var(--gold); margin-bottom: 20px; }
.arch-result-desc { font-family: 'IM Fell English', serif; font-style: italic; font-size: 1rem; line-height: 1.7; color: var(--black); margin-bottom: 20px; }
.arch-result-traits { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 36px; }
.arch-trait { border: var(--border); padding: 4px 12px; font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--shadow); }

/* DECK SCREEN */
.deck-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; }
.deck-pill {
  border: var(--border); padding: 8px 18px;
  cursor: pointer; font-size: 0.7rem;
  text-transform: uppercase; letter-spacing: 0.08em;
  background: rgba(255,255,255,0.4); border-radius: 20px;
  transition: all 0.15s;
}
.deck-pill:hover { border-color: var(--gold); color: var(--gold); }
.deck-pill.sel { background: var(--black); color: var(--cream); border-color: var(--black); }
.deck-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.deck-prompt { font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--shadow); }
.shuffle-btn {
  border: var(--border); padding: 6px 16px;
  cursor: pointer; font-family: 'Space Mono', monospace;
  font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em;
  background: none; border-radius: var(--radius); transition: all 0.15s;
}
.shuffle-btn:hover { border-color: var(--gold); color: var(--gold); }

/* CARD TABLE */
.card-table {
  position: relative; min-height: 200px;
  display: flex; flex-wrap: wrap; gap: 12px;
  align-items: center; justify-content: center;
  padding: 24px 8px;
}
@media(max-width:560px) {
  .card-table { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; padding: 24px 0; }
}
.mc {
  --rot: 0deg; --dy: 0px; --glow: 0;
  width: 50px; height: 80px;
  background: var(--black);
  border: 1.5px solid var(--shadow);
  border-radius: 3px;
  cursor: pointer;
  flex-shrink: 0;
  transform: rotate(var(--rot)) translateY(var(--dy));
  box-shadow: 2px 3px 0 #080602, 0 0 calc(var(--glow)*18px) calc(var(--glow)*2px) rgba(154,120,24,calc(var(--glow)*0.7));
  transition: box-shadow 0.1s, transform 0.15s;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.55rem; color: var(--gold);
  font-family: 'Space Mono', monospace;
  letter-spacing: 0.05em;
  position: relative;
  overflow: hidden;
}
.mc::after {
  content: 'S';
  font-family: 'IM Fell English', serif;
  font-size: 1.1rem; color: rgba(154,120,24,0.25);
  position: absolute;
}
.mc.picked { border-color: var(--gold); box-shadow: 2px 3px 0 #080602, 0 0 12px 2px rgba(154,120,24,0.5); }
.mc:hover { transform: rotate(var(--rot)) translateY(calc(var(--dy) - 4px)) scale(1.08); }
.mc.picked:hover { transform: rotate(var(--rot)) translateY(calc(var(--dy) - 4px)) scale(1.08); }

/* FULL CARDS */
.picked-area { margin-top: 32px; }
.picked-row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-bottom: 32px; }
.wcard-wrap {
  perspective: 800px;
  width: 210px; height: 348px;
  flex-shrink: 0;
}
.wcard {
  width: 210px; height: 348px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.7s cubic-bezier(0.4,0,0.2,1);
  cursor: default;
}
.wcard.flipped { transform: rotateY(180deg); }
.wcard-face, .wcard-back {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  border: var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.wcard-back {
  background: var(--black);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 3px 3px 0 var(--shadow);
}
.wcard-back-text {
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem; color: var(--gold);
  letter-spacing: 0.15em; text-transform: uppercase;
  writing-mode: horizontal-tb;
}
.wcard-face {
  background: var(--cream);
  transform: rotateY(180deg);
  display: flex; flex-direction: column;
  padding: 16px;
  box-shadow: 3px 3px 0 var(--shadow);
}
.wcard-deck-label {
  font-size: 0.55rem; letter-spacing: 0.15em;
  text-transform: uppercase; color: var(--shadow);
  margin-bottom: 2px;
}
.wcard-icon { font-size: 1rem; margin-bottom: 6px; }
.wcard-name {
  font-family: 'IM Fell English', serif;
  font-style: italic; font-size: 0.95rem;
  color: var(--gold); margin-bottom: 10px;
  border-bottom: 1px solid var(--cream-deep);
  padding-bottom: 8px;
}
.wcard-quote {
  font-family: 'IM Fell English', serif;
  font-size: 0.95rem; line-height: 1.55;
  flex: 1; color: var(--black);
  overflow-y: auto; scrollbar-width: none;
}
.wcard-quote::-webkit-scrollbar { display: none; }
.wcard-attr {
  margin-top: 10px; font-size: 0.58rem;
  color: var(--shadow); letter-spacing: 0.06em;
  border-top: 1px solid var(--cream-deep);
  padding-top: 8px;
}

/* READING */
.reading-panel {
  border: var(--border); padding: 32px;
  background: rgba(255,255,255,0.5);
  border-radius: var(--radius);
  margin-top: 8px;
}
.reading-section { margin-bottom: 32px; }
.reading-section:last-of-type { margin-bottom: 24px; }
.reading-label {
  font-size: 0.6rem; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--gold);
  margin-bottom: 12px;
}
.reading-text {
  font-family: 'IM Fell English', serif;
  font-size: 1rem; line-height: 1.75;
  color: var(--black);
}
.reading-action {
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem; line-height: 1.7;
  color: var(--black);
  border-left: 2px solid var(--gold);
  padding-left: 16px;
}
.reading-divider { border: none; border-top: 1px solid var(--cream-deep); margin: 0 0 32px; }
.save-all-btn {
  border: var(--border); padding: 10px 24px;
  cursor: pointer; font-family: 'Space Mono', monospace;
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em;
  background: none; border-radius: var(--radius); transition: all 0.15s;
}
.save-all-btn:hover { background: var(--black); color: var(--cream); }
.reveal-btn {
  display: block; width: 100%;
  border: var(--border); padding: 14px;
  cursor: pointer; font-family: 'Space Mono', monospace;
  font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em;
  background: var(--black); color: var(--cream);
  border-radius: var(--radius); transition: all 0.2s;
  margin-top: 8px;
}
.reveal-btn:hover { background: var(--shadow); }

/* ARCHIVE */
.archive-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
.archive-title { font-family: 'IM Fell English', serif; font-size: 1.3rem; }
.clear-btn {
  border: var(--border); padding: 6px 14px;
  cursor: pointer; font-family: 'Space Mono', monospace;
  font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em;
  background: none; border-radius: var(--radius);
}
.clear-btn:hover { background: var(--cream-deep); }
.archive-grid { display: flex; flex-wrap: wrap; gap: 20px; }
.archive-empty { font-size: 0.8rem; color: var(--shadow); font-style: italic; padding: 40px 0; }

/* UTILITY */
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="topbar">
  <span class="logo" id="logo-btn">Sharper.</span>
  <nav class="nav">
    <button class="nav-btn on" data-tab="home" id="nav-home">home</button>
    <button class="nav-btn" data-tab="deck" id="nav-deck">deck</button>
    <button class="nav-btn" data-tab="archive" id="nav-archive">archive</button>
  </nav>
  <div class="topbar-right">
    <button class="reassess-btn hidden" id="reassess-btn">reassess</button>
    <button class="lang-btn" id="lang-btn">中文</button>
  </div>
</div>

<main>
  <!-- HOME SCREEN -->
  <div class="screen on" id="screen-home">
    <!-- Landing -->
    <div id="view-landing">
      <div class="landing-hero">
        <div class="landing-title" id="landing-title">Sharper.</div>
        <div class="landing-sub" id="landing-sub">every day, a card. every card, a move.</div>
        <div id="arch-preview-wrap" class="hidden">
          <div class="archetype-preview" id="arch-preview"></div>
          <br>
        </div>
        <button class="cta-btn" id="cta-main"></button>
        <button class="cta-btn secondary hidden" id="cta-secondary"></button>
      </div>
    </div>
    <!-- Quiz -->
    <div id="view-quiz" class="hidden">
      <div class="quiz-wrap">
        <div class="quiz-title" id="quiz-title">your archetype awaits</div>
        <div class="quiz-progress" id="quiz-progress">question 1 of 5</div>
        <div class="quiz-q" id="quiz-q"></div>
        <div class="quiz-opts" id="quiz-opts"></div>
        <div class="quiz-nav">
          <button class="quiz-nav-btn" id="quiz-back-btn"></button>
          <button class="quiz-nav-btn primary" id="quiz-next-btn"></button>
        </div>
      </div>
    </div>
    <!-- Archetype Result -->
    <div id="view-arch-result" class="hidden">
      <div class="arch-result" id="arch-result-content"></div>
    </div>
  </div>

  <!-- DECK SCREEN -->
  <div class="screen" id="screen-deck">
    <div class="deck-pills" id="deck-pills"></div>
    <div id="deck-table-wrap" class="hidden">
      <div class="deck-header">
        <div class="deck-prompt" id="deck-prompt">pick up to 3 cards</div>
        <button class="shuffle-btn" id="shuffle-btn">shuffle</button>
      </div>
      <div class="card-table" id="card-table"></div>
      <div class="picked-area" id="picked-area">
        <div class="picked-row" id="picked-row"></div>
        <button class="reveal-btn hidden" id="reveal-btn"></button>
        <div id="reading-wrap" class="hidden"></div>
      </div>
    </div>
  </div>

  <!-- ARCHIVE SCREEN -->
  <div class="screen" id="screen-archive">
    <div class="archive-header">
      <div class="archive-title" id="arch-tab-title">archive</div>
      <button class="clear-btn" id="clear-btn"></button>
    </div>
    <div id="archive-grid"></div>
  </div>
</main>

const CARDS = {
  leadership: [
    { id:'l1', icon:'⚔', en:{name:'the warlord',quote:'The general who wins the battle makes many calculations in his temple before the battle is fought.',attr:'Sun Tzu · The Art of War · c. 500 BC',sharper:'your first move is always made in private. before the room fills, before the voices compete — you have already mapped the terrain.',do:'before your next high-stakes conversation, spend 10 minutes alone mapping what you want, what they want, and where the leverage is.',dont:"don't walk into your next important conversation without having mapped it privately first.",evening:'where did you make your move before you had all the information — and what did that cost you?'}, zh:{name:'兵圣',quote:'未战而庙算胜者，得算多也。',attr:'孙子 · 《孙子兵法》· 约公元前500年',sharper:'你的第一步永远在私下完成。在人群涌入、声音交织之前——你已绘制出地形。',do:'在下一次高风险对话之前，独自花10分钟梳理你想要什么、他们想要什么，以及筹码在哪里。',dont:'不要在未经私下勘测的情况下走进你的下一场重要对话。',evening:'你在哪里于信息尚未齐备时已出手——那让你付出了什么代价？'}},
    { id:'l2', icon:'⚔', en:{name:'the inner lamp',quote:'Knowing others is intelligence; knowing yourself is true wisdom.',attr:'Lao Tzu · Tao Te Ching · c. 400 BC',sharper:'the leader others trust is the one who has already interrogated their own motives. self-knowledge is not navel-gazing — it is the foundation of credibility.',do:'write down one decision you made this week. then write down the real reason you made it — not the reason you told others.',dont:"don't lead others into territory you haven't first explored in yourself.",evening:'what did you perform today that you did not actually feel?'}, zh:{name:'内照',quote:'知人者智，自知者明。',attr:'老子 · 《道德经》· 约公元前400年',sharper:'他人所信赖的领导者，是那位已审问过自身动机的人。自知并非自怜——它是可信度的基石。',do:'写下你本周做出的一个决定，然后写下你真正做出它的原因——而非你告诉他人的那个原因。',dont:'不要将他人引入你自己尚未勘探的领域。',evening:'你今天表演了什么，而你实际并未感受到？'}},
    { id:'l3', icon:'⚔', en:{name:'the empty throne',quote:'To lead people, walk behind them.',attr:'Lao Tzu · Tao Te Ching · c. 400 BC',sharper:'the loudest voice in the room is rarely the most powerful. the leader who steps back creates space for others to step forward — and reveals who they really are.',do:'in your next meeting, speak last. let everyone else go first. notice what changes.',dont:"don't fill every silence. some of the most powerful moves are made in stillness.",evening:'where did you speak when you should have listened?'}, zh:{name:'无为',quote:'圣人不积，既以为人己愈有。',attr:'老子 · 《道德经》· 约公元前400年',sharper:'房间里声音最响的，鲜少是力量最强的。退后一步的领导者为他人开辟了前进的空间——并揭示出他们真实的样子。',do:'在下一次会议中，最后发言。让所有人先说。观察有何改变。',dont:'不要填满每一段沉默。最有力的棋，有时走于静止之中。',evening:'你在哪里本该倾听却开口说话了？'}},
    { id:'l4', icon:'⚔', en:{name:'the sovereign',quote:'He who controls others may be powerful, but he who has mastered himself is mightier still.',attr:'Lao Tzu · Tao Te Ching · c. 400 BC',sharper:'authority that depends on controlling others is fragile. the leader who has mastered their own reactions commands a room without raising their voice.',do:'identify one trigger that reliably pulls you off-center. before your next exposure to it, decide in advance how you will respond.',dont:"don't mistake reactivity for strength. composure is the harder discipline.",evening:'where did your emotions lead, and your judgment follow?'}, zh:{name:'慎独',quote:'胜人者有力，自胜者强。',attr:'老子 · 《道德经》· 约公元前400年',sharper:'依赖掌控他人的权威是脆弱的。掌控自身反应的领导者，无需提高声音便能掌控全场。',do:'找出一个惯常让你失中的触发点。在下次接触它之前，预先决定你将如何应对。',dont:'不要将冲动误认为力量。沉着是更难的修炼。',evening:'你的情绪在哪里领先，而判断在后追随？'}},
    { id:'l5', icon:'⚔', en:{name:'the still water',quote:'The best leaders are those the people hardly know exist.',attr:'Lao Tzu · Tao Te Ching · c. 400 BC',sharper:"true influence leaves no fingerprints. when the team succeeds, they say 'we did it.' the leader knows this is the goal, not the exception.",do:"this week, redirect one piece of credit to someone on your team. say 'they made this happen' and mean it.",dont:"don't let your need to be seen undermine what you're building.",evening:"where did your ego walk into the room before you did?"}, zh:{name:'心镜',quote:'太上，不知有之。',attr:'老子 · 《道德经》· 约公元前400年',sharper:'真正的影响力不留指纹。当团队成功时，他们说"是我们做到的"。领导者知道，这才是目标，而非例外。',do:'本周，将一份功劳转让给团队中的某人。说"是他们做成了这件事"——并且真心如此。',dont:'不要让你被看见的需求破坏你正在建造的东西。',evening:'你的自我在哪里先于你本人走进了房间？'}},
    { id:'l6', icon:'⚔', en:{name:'the face and the mask',quote:'All the world is a stage, and all the men and women merely players.',attr:'William Shakespeare · As You Like It · 1599',sharper:"you play many roles. the question isn't which role is real — it's whether you remember who's doing the playing.",do:'list three roles you played today. for each one, write who you were playing for — and who you actually are beneath it.',dont:"don't lose the actor in the performance.",evening:'where did the role you were playing start to feel more real than you?'}, zh:{name:'表里',quote:'世界是一个舞台，所有男男女女不过是演员。',attr:'威廉·莎士比亚 · 《皆大欢喜》· 1599年',sharper:'你扮演着许多角色。问题不在于哪个角色是真实的——而在于你是否记得谁在扮演。',do:'列出你今天扮演的三个角色。对每一个，写下你在为谁表演——以及你在其下究竟是谁。',dont:'不要在表演中迷失那个演员。',evening:'你扮演的角色在哪里开始比你本人更真实？'}},
    { id:'l7', icon:'⚔', en:{name:'the grindstone',quote:'I am not afraid of the man who has practiced 10,000 kicks once, but I am afraid of the man who has practiced one kick 10,000 times.',attr:'Bruce Lee · c. 1970',sharper:"mastery isn't a destination — it's a practice. the leader who keeps sharpening becomes a different kind of force: one that doesn't need to announce itself.",do:'identify the one skill that would compound the most in your current role. commit to 15 minutes of deliberate practice on it today.',dont:"don't confuse exposure for mastery. doing something often isn't the same as doing it deeply.",evening:"where did you go through the motions instead of going through the work?"}, zh:{name:'磨砺',quote:'我不惧怕练过一万种踢法的人，但我惧怕将一种踢法练过一万次的人。',attr:'李小龙 · 约1970年',sharper:'精通不是终点——它是修炼。持续磨砺的领导者成为另一种力量：不需要自我宣告的那种。',do:'找出在你当前角色中复利最大的那项技能。今天承诺对它进行15分钟的刻意练习。',dont:'不要将接触误认为精通。频繁做某事并不等同于深入做某事。',evening:'你在哪里只是走过动作，而非真正走过工作？'}},
    { id:'l8', icon:'⚔', en:{name:'the long view',quote:'Vision without action is merely a dream. Action without vision just passes the time.',attr:'Joel A. Barker · c. 1990',sharper:'the leader with the longest time horizon wins most games. not because the future is certain — but because thinking long creates moves short-sighted players never see.',do:'take one decision you are making this week and ask: how does this look in 5 years? does that change your move?',dont:"don't sacrifice next year's position for this week's comfort.",evening:'where did you think short when the situation called for long?'}, zh:{name:'远见',quote:'没有行动的愿景只是梦想。没有愿景的行动只是消磨时间。',attr:'乔尔·巴克 · 约1990年',sharper:'拥有最长时间视野的领导者赢得大多数博弈。不是因为未来确定——而是因为长远思考创造出短视者永远看不见的棋路。',do:'取你本周正在做出的一个决定，问：五年后这看起来如何？这是否改变了你的棋路？',dont:'不要为了本周的舒适而牺牲明年的位置。',evening:'你在哪里思考得太短，而局势需要更长？'}}
  ],
  'critical-thinking': [
    { id:'c1', icon:'🔬', en:{name:'the open question',quote:'The important thing is not to stop questioning.',attr:'Albert Einstein · Life Magazine · 1955',sharper:'certainty closes doors. the question holds the door open. the thinker who never stops asking is the one who keeps finding what others already concluded was settled.',do:'take one belief you hold firmly about your current situation. write down three reasons it might be wrong.',dont:"don't let the comfort of a conclusion stop you from questioning it.",evening:'what did you stop questioning today that deserves a second look?'}, zh:{name:'持疑',quote:'重要的是不要停止追问。',attr:'阿尔伯特·爱因斯坦 · 《生活》杂志 · 1955年',sharper:'确信关上了门。问题让门保持开启。永不停止追问的思考者，是那个持续发现他人早已认定已定之事的人。',do:'取你对当前处境持有的一个坚定信念。写下三个它可能是错的理由。',dont:'不要让结论的舒适阻止你质疑它。',evening:'你今天停止质疑了什么——而它值得再看一眼？'}},
    { id:'c2', icon:'🔬', en:{name:'the invisible lens',quote:"It is not what we do not know that gets us into trouble. It is what we know for sure that just ain't so.",attr:'Mark Twain · c. 1890s',sharper:"your assumptions are invisible to you. they don't feel like assumptions — they feel like facts. the crack in your thinking lives exactly there.",do:'identify one assumption you made in a recent decision. ask: how did I come to believe this — and what if it is not true?',dont:"don't confuse familiarity with accuracy.",evening:"where did what you 'knew' lead you away from what was actually true?"}, zh:{name:'成见',quote:'让我们陷入麻烦的，不是我们不知道的事，而是我们确信无疑却并非如此的事。',attr:'马克·吐温 · 约1890年代',sharper:'你的假设对你自己是隐形的。它们感觉不像假设——感觉像事实。你思维中的裂缝，恰好藏在那里。',do:'找出你在最近某个决定中做出的一个假设。问：我是怎么相信这个的——如果它不是真的呢？',dont:'不要将熟悉感与准确性混淆。',evening:'你"知道"的事在哪里将你引离了实际为真的事？'}},
    { id:'c3', icon:'🔬', en:{name:'the dialectic',quote:'The test of a first-rate intelligence is the ability to hold two opposed ideas in mind at the same time and still retain the ability to function.',attr:'F. Scott Fitzgerald · The Crack-Up · 1936',sharper:'the trap is picking a side too quickly. the sophisticated move is to hold the tension — to let both things be true until the third option emerges.',do:'take a conflict or dilemma you are facing. write the strongest case for each side — without immediately resolving it.',dont:"don't rush to resolution. sometimes the most generative thing is to stay in the question.",evening:'where did you collapse a complexity into a binary when the truth was more nuanced?'}, zh:{name:'辩证',quote:'一流智识的检验，在于能否同时持守两种对立的观念，同时仍保有正常运作的能力。',attr:'菲茨杰拉德 · 《崩溃》· 1936年',sharper:'陷阱在于过快选边。老练的棋路是保持张力——让两件事同时为真，直到第三种选项浮现。',do:'取你正面临的一个冲突或困境。写出双方最有力的论据——不要急于解决。',dont:'不要急于决断。有时最富生产力的事是停留在问题之中。',evening:'你在哪里将一个复杂性压缩成了二元，而真相更为细腻？'}},
    { id:'c4', icon:'🔬', en:{name:'the examined self',quote:'An unexamined life is not worth living.',attr:'Socrates · via Plato · Apology · 399 BC',sharper:'the hardest object to see clearly is yourself. most people see what they want to see. the thinker who can look at themselves with cold accuracy gains a rare kind of freedom.',do:'pick one story you tell about yourself. ask: what evidence supports this — and what evidence contradicts it?',dont:"don't protect your self-image at the expense of your self-knowledge.",evening:'what truth about yourself did you avoid today?'}, zh:{name:'自知',quote:'未经省察的人生不值得过。',attr:'苏格拉底 · 经柏拉图记录 · 《申辩》· 公元前399年',sharper:'最难清晰看见的对象是你自己。大多数人只看见他们想看见的。能以冷静准确审视自身的思考者，获得了一种罕见的自由。',do:'选取一个你关于自己讲述的故事。问：有什么证据支持它——又有什么证据与之矛盾？',dont:'不要以损害自我认知的代价来保护自我形象。',evening:'你今天回避了什么关于自己的真相？'}},
    { id:'c5', icon:'🔬', en:{name:'the useful question',quote:'Judge a man by his questions rather than by his answers.',attr:'Voltaire · c. 1760',sharper:'the quality of your thinking is the quality of your questions. a sharp question opens more doors than a confident answer closes. ask better to think better.',do:'before your next important meeting, write down three questions you genuinely do not know the answer to. lead with one of them.',dont:"don't perform understanding you don't have.",evening:"what question did you not ask today — because you were afraid of what the answer might reveal?"}, zh:{name:'善问',quote:'以问题而非答案来判断一个人。',attr:'伏尔泰 · 约1760年',sharper:'你思维的质量就是你问题的质量。一个尖锐的问题打开的门，比一个自信的答案关上的更多。更好地问，才能更好地想。',do:'在下一次重要会议之前，写下三个你真正不知道答案的问题。以其中一个开场。',dont:'不要表演你并不具备的理解。',evening:'你今天没有问什么问题——因为你害怕答案可能揭示什么？'}},
    { id:'c6', icon:'🔬', en:{name:'the quiet mind',quote:"All of humanity's problems stem from man's inability to sit quietly in a room alone.",attr:'Blaise Pascal · Pensées · 1670',sharper:'the mind that cannot be still cannot think clearly. noise — inner or outer — distorts perception. stillness is not emptiness; it is the condition for precision.',do:'take 10 minutes today with no input. no phone, no music, no podcast. just sit with the problem you are currently avoiding.',dont:"don't fill every quiet moment with noise. you are avoiding something in there.",evening:'what came up in the silence today that you immediately reached for your phone to escape?'}, zh:{name:'静思',quote:'人类所有的问题都源于人无法独自安静地坐在房间里。',attr:'布莱兹·帕斯卡 · 《思想录》· 1670年',sharper:'无法静止的心灵无法清晰思考。噪音——内在的或外在的——扭曲感知。静止不是空无；它是精确的条件。',do:'今天花10分钟不接受任何输入。没有手机、没有音乐、没有播客。只是与你当前正在回避的问题坐在一起。',dont:'不要用噪音填满每一个安静的时刻。你在那里回避着什么。',evening:'今天的沉默中浮现了什么，让你立刻伸手拿起手机逃离？'}},
    { id:'c7', icon:'🔬', en:{name:'the minority report',quote:'Whenever you find yourself on the side of the majority, it is time to pause and reflect.',attr:'Mark Twain · c. 1904',sharper:'consensus is comfortable. it is also often wrong. the thinker who can hold a position others have not yet reached — and hold it calmly — is the one who creates new ground.',do:'identify one view you hold that most people around you do not share. write down why you still hold it — and whether you should.',dont:"don't update your view because the room did. update it when the evidence does.",evening:"where did you adjust your position to fit the room rather than your own analysis?"}, zh:{name:'独见',quote:'每当你发现自己站在多数人一边时，是时候停下来反思了。',attr:'马克·吐温 · 约1904年',sharper:'共识是舒适的。它也常常是错的。能够持守他人尚未抵达的立场——并平静地持守——的思考者，是那个开辟新地的人。',do:'找出一个你持有而周围大多数人不认同的观点。写下你仍然持守它的原因——以及你是否应该。',dont:'不要因为房间更新了就更新你的观点。当证据更新时再更新它。',evening:'你在哪里调整了自己的立场以适应房间，而非你自己的分析？'}},
    { id:'c8', icon:'🔬', en:{name:'the beginner',quote:"In the beginner's mind there are many possibilities, but in the expert's mind there are few.",attr:"Shunryu Suzuki · Zen Mind, Beginner's Mind · 1970",sharper:"expertise is also a trap. the more you know, the more you filter out. the beginner sees everything. sometimes the most sophisticated move is to unknow what you know.",do:"approach one task today as if you have never done it before. ask: if I were new to this, what would I notice that I have stopped noticing?",dont:"don't let mastery become blindness.",evening:"what did you stop seeing today because you already 'knew' how it works?"}, zh:{name:'虚怀',quote:'初学者的心中有许多可能，但专家的心中却少有。',attr:'铃木俊隆 · 《禅者的初心》· 1970年',sharper:'专业知识也是一个陷阱。你知道得越多，你过滤掉的也越多。初学者看见一切。有时最老练的棋路是去"不知道"你已知道的。',do:'今天以从未做过的方式处理一项任务。问：如果我是新手，我会注意到什么是我已经停止注意的？',dont:'不要让精通变成盲目。',evening:'你今天停止看见了什么——因为你已经"知道"它如何运作？'}}
  ],
  communication: [
    { id:'co1', icon:'🌊', en:{name:'the pause',quote:'Silence is a source of great strength.',attr:'Lao Tzu · Tao Te Ching · c. 400 BC',sharper:'the communicator who owns the pause owns the room. silence is not weakness — it is pressure. it creates space for the other person to fill, and what they fill it with tells you everything.',do:'in your next conversation, let there be one silence after you speak. count to three before filling it. watch what happens.',dont:"don't fill every silence. the one who speaks first in an empty space often reveals more than they intended.",evening:'where did you speak to avoid the discomfort of not speaking?'}, zh:{name:'沉默',quote:'沉默是力量的巨大源泉。',attr:'老子 · 《道德经》· 约公元前400年',sharper:'掌控停顿的沟通者掌控全场。沉默不是软弱——它是压力。它为对方创造了填充的空间，而他们用什么填充，告诉你一切。',do:'在下一次对话中，在你说话后留下一个沉默。在填补它之前数到三。观察发生了什么。',dont:'不要填满每一个沉默。在空旷中第一个开口的人，往往比他们打算的透露了更多。',evening:'你在哪里开口说话，是为了回避不说话的不适？'}},
    { id:'co2', icon:'🌊', en:{name:'the unspoken',quote:'The most important thing in communication is hearing what is not said.',attr:'Peter Drucker · c. 1970',sharper:'beneath every spoken message is an unspoken one. the master communicator reads both channels simultaneously. what someone chooses not to say is often the signal.',do:'in your next significant conversation, listen for what is not being said. what topic is being avoided? what emotion is present but unnamed?',dont:"don't take words at face value. meaning lives in the gap between the said and the unsaid.",evening:'what did someone try to tell you today without saying it directly?'}, zh:{name:'弦外',quote:'沟通中最重要的事，是听见未被说出的。',attr:'彼得·德鲁克 · 约1970年',sharper:'每一句说出口的话之下，都有一句未说出的。大师级沟通者同时读取两个频道。一个人选择不说的，往往才是信号。',do:'在下一次重要对话中，倾听未被说出的内容。什么话题正在被回避？什么情绪在场却未被命名？',dont:'不要按字面意思理解话语。意义住在说出的与未说出的之间。',evening:'今天有人试图告诉你什么，却没有直接说出来？'}},
    { id:'co3', icon:'🌊', en:{name:'the clean line',quote:'If you cannot explain it simply, you do not understand it well enough.',attr:'Albert Einstein · c. 1930',sharper:'complexity is often a hiding place. the one who truly understands can strip away everything non-essential and leave only the core. clarity is a form of power.',do:'take the most complex idea you are currently working with. explain it in three sentences to someone who has no background in it. see where you stumble.',dont:"don't use complexity to perform intelligence. it usually reveals the opposite.",evening:'where did you use language to obscure rather than to clarify?'}, zh:{name:'清言',quote:'如果你无法简单解释它，你对它的理解还不够深。',attr:'阿尔伯特·爱因斯坦 · 约1930年',sharper:'复杂性常常是一个藏身之处。真正理解的人能剥去所有非必要的，只留下核心。清晰是一种力量。',do:'取你当前正在处理的最复杂的想法。用三句话向一个对此毫无背景的人解释它。看看你在哪里绊倒。',dont:'不要用复杂性来表演智识。它通常揭示的是相反的东西。',evening:'你在哪里用语言遮掩而非澄清？'}},
    { id:'co4', icon:'🌊', en:{name:'the controlled burn',quote:'Speak when you are angry and you will make the best speech you will ever regret.',attr:'Ambrose Bierce · c. 1900',sharper:'the emotion that wants to speak now is rarely the one that should. the communicator who can hold a charged feeling long enough for clarity to arrive says the right thing — not just the urgent thing.',do:'identify a message you have been wanting to send from a charged emotional state. write it. then wait 24 hours before deciding whether to send it.',dont:"don't let urgency borrow your voice. most things that feel urgent are not.",evening:'what did you say today that would have landed differently if you had waited?'}, zh:{name:'自持',quote:'在愤怒时开口，你将发表你一生中最令自己后悔的演讲。',attr:'安布罗斯·比尔斯 · 约1900年',sharper:'想要立刻说话的情绪，很少是应该说话的那个。能将一种激烈的感受持守足够长时间让清晰浮现的沟通者，说的是正确的事——而非仅仅是紧迫的事。',do:'找出一条你一直想从激动情绪中发送的信息。把它写下来。然后等待24小时再决定是否发送。',dont:'不要让紧迫感借用你的声音。大多数感觉紧迫的事情并不紧迫。',evening:'你今天说了什么，如果等一等，落地方式会有所不同？'}},
    { id:'co5', icon:'🌊', en:{name:'the short blade',quote:'I have made this letter longer than usual, only because I have not had the time to make it shorter.',attr:'Blaise Pascal · Lettres provinciales · 1656',sharper:"brevity is not the absence of thought — it is its distillation. the communicator who can say it in fewer words has done more work, not less.",do:'find a message or document you recently sent. cut it by 30%. see if anything essential is lost.',dont:"don't use length to signal effort. use precision.",evening:'where did you take more words than the thought required?'}, zh:{name:'简言',quote:'这封信比平常更长，只因为我没有时间把它写短。',attr:'布莱兹·帕斯卡 · 《致外省人书》· 1656年',sharper:'简洁不是思想的缺席——它是思想的提炼。能用更少词语说清楚的沟通者，付出的是更多而非更少的努力。',do:'找一条你最近发送的消息或文件。将它削减30%。看看是否有任何本质的东西丢失了。',dont:'不要用长度来标榜努力。用精确来标榜。',evening:'你在哪里用了比思想所需更多的词语？'}},
    { id:'co6', icon:'🌊', en:{name:'the reframe',quote:'If you change the way you look at things, the things you look at change.',attr:'Wayne Dyer · c. 1990',sharper:"the frame is not the content — but it determines how the content is received. the communicator who controls the frame controls the conversation. reframing isn't spin — it's precision.",do:"take a message you need to deliver that will be hard to receive. find a frame that makes it easier to hear without changing the truth.",dont:"don't let the default framing stand if a better one is available.",evening:'where did you give someone a hard truth in a way that made it harder to receive than it needed to be?'}, zh:{name:'换框',quote:'如果你改变看待事物的方式，你所看待的事物也会改变。',attr:'韦恩·戴尔 · 约1990年',sharper:'框架不是内容——但它决定内容如何被接收。掌控框架的沟通者掌控对话。重新框架不是操纵——它是精确。',do:'取一条你需要传达的、难以被接受的信息。找到一个让它更容易被听见的框架——不要改变真相。',dont:'如果有更好的框架可用，不要让默认框架停留在那里。',evening:'你在哪里以一种比必要更难被接收的方式给了某人一个艰难的真相？'}},
    { id:'co7', icon:'🌊', en:{name:'the soft blade',quote:'A soft answer turneth away wrath, but grievous words stir up anger.',attr:'Proverbs 15:1 · c. 950 BC',sharper:'the gentlest tone can carry the sharpest point. force often generates resistance. the communicator who delivers difficulty with warmth moves more than the one who delivers it with edge.',do:'identify a difficult message you need to deliver. practice saying it in the most direct AND warm way possible. find the tone that does both.',dont:"don't confuse bluntness with honesty. you can be precise and kind at the same time.",evening:'where did your tone undermine your message?'}, zh:{name:'柔言',quote:'温和的回答能消除愤怒，但伤人的话语会激起怒火。',attr:'《箴言》15:1 · 约公元前950年',sharper:'最温柔的语气能承载最尖锐的观点。力量常常产生抵抗。以温情传递困难的沟通者，比以锋芒传递的人移动得更多。',do:'找出一条你需要传达的困难信息。练习以最直接且温暖的方式说它。找到两者兼顾的语气。',dont:'不要将直白与诚实混淆。你可以同时精确而善意。',evening:'你的语气在哪里破坏了你的信息？'}},
    { id:'co8', icon:'🌊', en:{name:'the full presence',quote:'Most people do not listen with the intent to understand; they listen with the intent to reply.',attr:'Stephen Covey · The 7 Habits of Highly Effective People · 1989',sharper:"listening is not waiting to speak. the communicator who can be fully present — without preparing their next move — receives information most people miss. presence is the rarest skill in a room.",do:'in your next conversation, set a private intention to listen only to understand — not to respond. notice how different the conversation feels.',dont:"don't perform listening while planning your reply. the other person can feel the difference.",evening:'who tried to be heard today, and did you actually hear them?'}, zh:{name:'善听',quote:'大多数人听话不是为了理解，而是为了回应。',attr:'史蒂芬·柯维 · 《高效能人士的七个习惯》· 1989年',sharper:'倾听不是等待说话。能够完全在场——不预备下一步棋——的沟通者，接收到大多数人错过的信息。在场是一个房间里最稀缺的技能。',do:'在下一次对话中，私下设定意图：只为理解而倾听——不为回应。注意对话感觉有多不同。',dont:'不要在计划回应的同时表演倾听。对方能感受到区别。',evening:'今天谁试图被倾听，而你真正听见了他们吗？'}}
  ],
  psychology: [
    { id:'ps1', icon:'🌑', en:{name:'the shadow',quote:'Until you make the unconscious conscious, it will direct your life and you will call it fate.',attr:'Carl Jung · c. 1935',sharper:"what you disown in yourself does not disappear. it goes underground and steers. the parts of you that you cannot look at directly will run the show from the dark.",do:'identify one trait in someone else that you find intensely irritating. ask: where does this live in me, unacknowledged?',dont:"don't project your disowned self onto others. what you cannot see in yourself, you will see everywhere else.",evening:'what emotion today did you call something else?'}, zh:{name:'幽暗',quote:'在你将无意识变为有意识之前，它将指引你的生命，而你将称之为命运。',attr:'卡尔·荣格 · 约1935年',sharper:'你在自身中否认的东西不会消失。它转入地下并驾驭方向。你无法直视的那部分你，将从黑暗中主导全局。',do:'找出他人身上让你极度恼怒的一个特质。问：这在我身上何处存在，未被承认？',dont:'不要将你否认的自我投射到他人身上。你在自身中看不见的，你将在其他所有地方看见。',evening:'你今天将哪种情绪称作了别的什么？'}},
    { id:'ps2', icon:'🌑', en:{name:'the wound',quote:'The wound is the place where the light enters you.',attr:'Rumi · c. 1250',sharper:"your oldest patterns were once solutions. the wound was not the end of you — it shaped you. the question is whether you are still running the old program in a context where it no longer serves.",do:'identify one pattern that keeps repeating in your life. ask: when did I first develop this? what was it protecting me from?',dont:"don't pathologize your patterns before understanding them. they made sense once.",evening:'what old strategy ran today in a situation that no longer called for it?'}, zh:{name:'伤痕',quote:'伤口是光进入你的地方。',attr:'鲁米 · 约1250年',sharper:'你最古老的模式曾经是解决方案。伤口不是你的终点——它塑造了你。问题在于你是否仍在一个不再需要它的情境中运行旧程序。',do:'找出你生命中一个不断重复的模式。问：我最初是什么时候形成这个的？它在保护我免受什么？',dont:'在理解你的模式之前，不要将它们病理化。它们曾经有意义。',evening:'哪个旧策略今天在一个不再需要它的情境中运行了？'}},
    { id:'ps3', icon:'🌑', en:{name:'the habit',quote:'We are what we repeatedly do. Excellence, then, is not an act, but a habit.',attr:'Aristotle · Nicomachean Ethics · c. 350 BC',sharper:'your life is not made of dramatic choices — it is made of tiny repeated ones. the gap between who you are and who you want to be is almost entirely a gap in daily behavior.',do:'identify one habit you have been wanting to change. instead of replacing it entirely, identify the smallest possible version of the new behavior and do it today.',dont:"don't wait for motivation to change a habit. the action creates the motivation, not the other way.",evening:'what small behavior did you repeat today that is building a version of yourself you do not want?'}, zh:{name:'习性',quote:'我们是由我们反复所做之事构成的。因此，卓越不是一个行为，而是一种习惯。',attr:'亚里士多德 · 《尼各马可伦理学》· 约公元前350年',sharper:'你的生命不是由戏剧性的选择构成的——它是由微小的、重复的选择构成的。你是谁与你想成为谁之间的差距，几乎完全是每日行为中的差距。',do:'找出一个你一直想改变的习惯。不要完全替换它，而是找出新行为的最小可能版本，今天就去做。',dont:'不要等待动力来改变习惯。行动创造动力，而非相反。',evening:'你今天重复了什么小行为，它正在塑造一个你不想要的自己的版本？'}},
    { id:'ps4', icon:'🌑', en:{name:'the mirror trap',quote:'We do not see things as they are. We see them as we are.',attr:'Anaïs Nin · Seduction of the Minotaur · 1961',sharper:"you are always the narrator of your own experience. the story you are telling about what's happening is not the same as what is happening. the projection is silent, constant, and invisible unless you look for it.",do:"take a situation that is bothering you. write down what you believe is happening. then write what might be happening if you were not in the story at all.",dont:"don't mistake your interpretation for reality. it is always one of many.",evening:'where today did your assumptions write the script that the other person was then forced to play?'}, zh:{name:'投射',quote:'我们看待事物的方式不是事物本来的样子。我们以自己的样子看待它们。',attr:'阿奈斯·宁 · 《迷宫的诱惑》· 1961年',sharper:'你永远是自己体验的叙述者。你对正在发生之事所讲述的故事，并不等同于正在发生的事。投射是无声的、持续的，且不可见——除非你去寻找它。',do:'取一个让你困扰的情境。写下你相信正在发生的事。然后写下，如果你根本不在这个故事中，可能正在发生什么。',dont:'不要将你的诠释误认为现实。它永远只是众多可能之一。',evening:'今天你的假设在哪里写了剧本，而对方被迫去扮演？'}},
    { id:'ps5', icon:'🌑', en:{name:'the rut',quote:'Insanity is doing the same thing over and over again and expecting different results.',attr:'commonly attributed to Einstein · origin disputed · c. 1980s',sharper:"the rut doesn't feel like a rut. it feels like the reasonable thing to do. until you can see the pattern from outside the pattern, you cannot change it.",do:'identify one area of your life where you have been getting the same unwanted result. list three different approaches you have never tried.',dont:"don't keep solving new problems with old solutions.",evening:'where did you expect a different result today while doing the same thing?'}, zh:{name:'惯性',quote:'疯狂是一遍又一遍地做同样的事，却期待不同的结果。',attr:'通常归于爱因斯坦 · 来源存疑 · 约1980年代',sharper:'困境感觉不像困境。它感觉像是合理的事情。在你能从模式之外看见模式之前，你无法改变它。',do:'找出你生命中一个持续得到同样不想要的结果的领域。列出三种你从未尝试过的不同方法。',dont:'不要用旧的解决方案持续解决新的问题。',evening:'你今天在哪里做着同样的事，却期待不同的结果？'}},
    { id:'ps6', icon:'🌑', en:{name:'the tribe pull',quote:'Man is by nature a social animal.',attr:'Aristotle · Politics · c. 350 BC',sharper:"belonging is a deep need — and one of the most powerful forces shaping your behavior without your awareness. you may be making choices to belong that you believe you are making freely.",do:'identify one belief or behavior you hold primarily because of the group you want to belong to. ask: is this actually mine?',dont:"don't mistake the tribe's voice for your own.",evening:'where today did you perform belonging rather than choose it?'}, zh:{name:'归属',quote:'人在本性上是社会性动物。',attr:'亚里士多德 · 《政治学》· 约公元前350年',sharper:'归属是一种深层需求——也是在你不知情的情况下塑造你行为的最强大力量之一。你可能正在做一些你以为是自由选择的、实则为了归属的决定。',do:'找出一个你持有主要因为你想归属的群体而持有的信念或行为。问：这真的是我的吗？',dont:'不要将部落的声音误认为自己的声音。',evening:'你今天在哪里表演了归属，而非选择了它？'}},
    { id:'ps7', icon:'🌑', en:{name:'the trigger',quote:'Between stimulus and response there is a space. In that space is our power to choose our response.',attr:"Viktor Frankl · Man's Search for Meaning · 1946",sharper:"you are not your reactions. the reaction is fast — but the space between trigger and response is where your character lives. that space can be widened with practice.",do:"identify one stimulus that reliably triggers an unwanted reaction in you. practice naming it the next time it appears, before reacting: 'this is the trigger.'",dont:"don't fuse the trigger with the reaction. they are not the same event.",evening:'where today did you react before you had the chance to respond?'}, zh:{name:'触动',quote:'在刺激与反应之间有一个空间。在那个空间里，存在着我们选择反应的力量。',attr:'维克多·弗兰克尔 · 《活出意义来》· 1946年',sharper:'你不是你的反应。反应是迅速的——但触发与回应之间的空间是你的品格所在。那个空间可以通过练习被拓宽。',do:"找出一个惯常触发你不想要的反应的刺激。练习在下次它出现时，在反应之前将其命名："这是触发点。"",dont:'不要将触发与反应融为一体。它们不是同一个事件。',evening:'你今天在哪里在有机会回应之前就反应了？'}},
    { id:'ps8', icon:'🌑', en:{name:'the inner child',quote:'The most creative act you will ever undertake is the act of creating yourself.',attr:'Deepak Chopra · c. 2000',sharper:"part of you stopped developing at a certain point. that part still runs some of your most emotional decisions. knowing which part of you is speaking at any given moment is one of the most powerful forms of self-knowledge.",do:'notice one moment today when you felt a disproportionately strong emotional reaction. ask: how old does this feeling feel? who is speaking?',dont:"don't let the youngest part of you make the decisions that require the most mature part.",evening:'what moment today called for the adult and got the child instead?'}, zh:{name:'童心',quote:'你将进行的最具创造性的行为，是创造你自己的行为。',attr:'狄巴克·乔布拉 · 约2000年',sharper:'你的一部分在某个时刻停止了发展。那个部分仍然驱动着你最情绪化的一些决定。知道在任何给定时刻是你的哪个部分在说话，是最有力的自我认知形式之一。',do:'注意今天你感到反应异常强烈的一个时刻。问：这种感觉感觉几岁？谁在说话？',dont:'不要让你最年幼的部分做出需要最成熟部分的决定。',evening:'今天哪个时刻需要成人而得到的却是孩子？'}}
  ],
  philosophy: [
    { id:'ph1', icon:'✦', en:{name:'the known unknown',quote:'I know that I know nothing.',attr:'Socrates · via Plato · c. 399 BC',sharper:"the beginning of wisdom is the recognition of its limit. the person who knows they do not know is closer to truth than the one who has stopped looking.",do:'identify the most important question in your life right now that you genuinely cannot answer. sit with the not-knowing for ten minutes without reaching for a solution.',dont:"don't mistake the absence of doubt for the presence of understanding.",evening:'what were you more certain about this morning than you should have been?'}, zh:{name:'无知之知',quote:'我唯一知道的，是我什么都不知道。',attr:'苏格拉底 · 经柏拉图记录 · 约公元前399年',sharper:'智慧的起点是对其边界的认识。知道自己不知道的人，比已停止寻找的人更接近真相。',do:'找出你生命中此刻最重要的、你真正无法回答的问题。与这种不知道共处十分钟，不要寻求解决方案。',dont:'不要将怀疑的缺席误认为理解的存在。',evening:'今晨你对什么过于确信？'}},
    { id:'ph2', icon:'✦', en:{name:'the present',quote:'Yesterday is history, tomorrow is a mystery, today is a gift. That is why it is called the present.',attr:'Eleanor Roosevelt · commonly attributed · c. 1940s',sharper:'most suffering happens in a time that is not now. the mind rehearses the future or revisits the past while the actual moment passes unlived. the practice is not optimism — it is attention.',do:'set one alarm today for a random time. when it goes off, notice: where is your attention? is it here?',dont:"don't spend the present solving a problem that does not yet exist.",evening:'how much of today did you actually inhabit?'}, zh:{name:'此刻',quote:'昨天是历史，明天是谜，今天是礼物。这就是为什么它被称为"当下"。',attr:'埃莉诺·罗斯福 · 常见归因 · 约1940年代',sharper:'大多数痛苦发生在非当下的时间里。心灵在排练未来或重访过去，而真实的时刻未被活过地流逝。这种修炼不是乐观——它是注意力。',do:'今天随机设置一个闹钟。当它响起时，注意：你的注意力在哪里？它在这里吗？',dont:'不要将当下花在解决一个尚不存在的问题上。',evening:'今天有多少你真正居住在其中？'}},
    { id:'ph3', icon:'✦', en:{name:'the examined life',quote:'The unexamined life is not worth living.',attr:'Socrates · via Plato · Apology · 399 BC',sharper:'most people live their lives at the surface. the examined life asks harder questions and tolerates the discomfort of not having answers. this is not a punishment — it is what it means to be fully alive.',do:'take 10 minutes tonight before bed. ask: what did I do today that I am proud of? what do I wish I had done differently? write down both.',dont:"don't let the day pass without asking what it meant.",evening:"what question about your own life are you most avoiding?"}, zh:{name:'省察',quote:'未经省察的人生不值得过。',attr:'苏格拉底 · 经柏拉图记录 · 《申辩》· 公元前399年',sharper:'大多数人在生命的表面生活。被省察的生命提出更难的问题，并容忍没有答案的不适。这不是惩罚——这是充分活着的意思。',do:'今晚睡前花10分钟。问：我今天做了什么让我自豪？我希望我做了什么不同？把两者都写下来。',dont:'不要让这一天在没有追问其意义的情况下流逝。',evening:'关于你自己的生命，你最回避的是什么问题？'}},
    { id:'ph4', icon:'✦', en:{name:'the river',quote:'You cannot step into the same river twice.',attr:'Heraclitus · Fragment · c. 500 BC',sharper:'the person you were is not the person you are. the situation as it was is not the situation as it is. most suffering comes from treating fixed what is fundamentally fluid.',do:'identify something in your life you have been treating as permanent. ask: what would change if I accepted that this is in motion?',dont:"don't grip so hard that you cannot move when the river does.",evening:'what are you holding onto that has already changed?'}, zh:{name:'流变',quote:'你无法两次踏入同一条河流。',attr:'赫拉克利特 · 残篇 · 约公元前500年',sharper:'你曾经是的那个人，不是你现在是的那个人。曾经的情境，不是现在的情境。大多数痛苦来自于将根本流动的东西视为固定的。',do:'找出你生命中一件你一直视为永久的事。问：如果我接受这是在运动中的，什么会改变？',dont:'不要抓得太紧以至于当河流改变时你无法移动。',evening:'你正在抓住什么，而它已经改变了？'}},
    { id:'ph5', icon:'✦', en:{name:'the moment of action',quote:'We suffer more in imagination than in reality.',attr:'Seneca · Letters to Lucilius · c. 65 AD',sharper:'the action you are avoiding is rarely as bad as the avoidance. most of the suffering is in the anticipation, not the doing. the move that seems impossible is usually just the first step.',do:'identify the one action you have been putting off the longest. do the smallest possible version of it today — not the full thing, just the start.',dont:"don't let the imagination of difficulty stand in for the actual attempt.",evening:'what did you avoid today that you have also avoided every day this week?'}, zh:{name:'时机',quote:'我们在想象中受苦，远多于在现实中受苦。',attr:'塞内卡 · 《给路西利乌斯的信》· 约公元65年',sharper:'你正在回避的行动，几乎从不像回避本身那么糟糕。大多数痛苦在于预期，而非行动。看似不可能的棋路，通常只是第一步。',do:'找出你拖延最久的那一个行动。今天做它的最小可能版本——不是全部，只是开始。',dont:'不要让对困难的想象代替实际的尝试。',evening:'你今天回避了什么，而你这周每天都在回避它？'}},

    { id:'ph8', icon:'✦', en:{name:'the whole',quote:'The whole is more than the sum of its parts.',attr:'Aristotle · Metaphysics · c. 350 BC',sharper:'the most important things cannot be seen by looking at the parts alone. the pattern only emerges when you step back far enough to see the whole. this applies to your life, your work, and your relationships.',do:'step back from something you have been inside for too long. ask: if I could only see the overall pattern — not the details — what would it tell me?',dont:"don't solve at the level of the part when the problem is at the level of the whole.",evening:'what detail were you so focused on today that you missed the larger pattern?'}, zh:{name:'整体',quote:'整体大于部分之和。',attr:'亚里士多德 · 《形而上学》· 约公元前350年',sharper:'最重要的事情无法仅通过观察部分来看见。只有当你退后足够远以看见整体时，模式才会浮现。这适用于你的生命、你的工作和你的关系。',do:'从你已经深陷其中太久的事物中退后。问：如果我只能看见整体模式——而非细节——它会告诉我什么？',dont:'不要在整体层面存在问题时在部分层面求解。',evening:'你今天专注于什么细节，以至于错过了更大的模式？'}}
  ]
};

const DECK_ICONS = { leadership:'⚔', 'critical-thinking':'🔬', communication:'🌊', psychology:'🌑', philosophy:'✦' };

// ── STATE ─────────────────────────────────────────────────────────────────────

const S = {
  lang: localStorage.getItem('sh_lang') || 'en',
  archetype: localStorage.getItem('sh_arch') || null,
  quizAnswers: [],
  qIdx: 0,
  deck: null,
  tableLayout: [],
  picked: [],
  favs: JSON.parse(localStorage.getItem('sh_favs') || '[]'),
  readingOpen: false
};

// ── HELPERS ───────────────────────────────────────────────────────────────────

const t = k => {
  const val = T[S.lang][k];
  return val !== undefined ? val : T.en[k];
};
const tDeck = d => T[S.lang].deckNames[d] || T.en.deckNames[d];
const cardL = c => c[S.lang];

function cap(str) { return str.charAt(0).toUpperCase() + str.slice(1); }

function rand(min, max) { return Math.random() * (max - min) + min; }

function calcArchetype(answers) {
  const counts = {};
  answers.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
  let best = null, bestN = 0;
  for (const [k, n] of Object.entries(counts)) {
    if (n > bestN) { bestN = n; best = k; }
  }
  return (bestN >= 2 && best) ? best : 'wanderer';
}

function saveFavs() { localStorage.setItem('sh_favs', JSON.stringify(S.favs)); }

function getCard(id) {
  for (const deck of Object.values(CARDS)) {
    const c = deck.find(c => c.id === id);
    if (c) return c;
  }
  return null;
}

// ── RENDER HELPERS ────────────────────────────────────────────────────────────

function renderCardFace(card) {
  const cl = cardL(card);
  const deckKey = Object.keys(CARDS).find(k => CARDS[k].some(c => c.id === card.id));
  return `
    <div class="wcard-deck-label">${tDeck(deckKey)}</div>
    <div class="wcard-icon">${card.icon}</div>
    <div class="wcard-name">${cl.name}</div>
    <div class="wcard-quote">${cl.quote}</div>
    <div class="wcard-attr">${cl.attr}</div>`;
}

function renderWcard(card, idx) {
  return `
    <div class="wcard-wrap">
      <div class="wcard" id="wcard-${idx}" data-idx="${idx}">
        <div class="wcard-back"><span class="wcard-back-text">Sharper · wisdom</span></div>
        <div class="wcard-face">${renderCardFace(card)}</div>
      </div>
    </div>`;
}

// ── TABS ──────────────────────────────────────────────────────────────────────

function showTab(tab) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('on'));
  document.getElementById('screen-' + tab).classList.add('on');
  document.getElementById('nav-' + tab).classList.add('on');
  if (tab === 'home') renderHome();
  if (tab === 'deck') renderDeck();
  if (tab === 'archive') renderArchive();
}

// ── HOME ──────────────────────────────────────────────────────────────────────

function renderHome() {
  // Show correct view
  const hasArch = !!S.archetype;
  document.getElementById('view-landing').classList.remove('hidden');
  document.getElementById('view-quiz').classList.add('hidden');
  document.getElementById('view-arch-result').classList.add('hidden');

  document.getElementById('landing-title').textContent = t('appName');
  document.getElementById('landing-sub').textContent = t('appSub');

  const previewWrap = document.getElementById('arch-preview-wrap');
  const ctaMain = document.getElementById('cta-main');
  const ctaSec = document.getElementById('cta-secondary');

  if (hasArch) {
    const arch = ARCHETYPES[S.archetype];
    const al = arch[S.lang];
    previewWrap.classList.remove('hidden');
    document.getElementById('arch-preview').innerHTML = `
      <div class="arch-glyph">${arch.glyph}</div>
      <div class="arch-name">${al.name}</div>
      <div class="arch-traits">${al.traits.join(' · ')}</div>`;
    ctaMain.textContent = t('enterDeck');
    ctaMain.onclick = () => showTab('deck');
    ctaSec.textContent = t('beginQuiz');
    ctaSec.classList.remove('hidden');
    ctaSec.onclick = startQuiz;
    document.getElementById('reassess-btn').classList.remove('hidden');
    document.getElementById('reassess-btn').textContent = t('reassess');
  } else {
    previewWrap.classList.add('hidden');
    ctaMain.textContent = t('beginQuiz');
    ctaMain.onclick = startQuiz;
    ctaSec.classList.add('hidden');
    document.getElementById('reassess-btn').classList.add('hidden');
  }
}

function startQuiz() {
  S.quizAnswers = [];
  S.qIdx = 0;
  document.getElementById('view-landing').classList.add('hidden');
  document.getElementById('view-quiz').classList.remove('hidden');
  document.getElementById('view-arch-result').classList.add('hidden');
  renderQuiz();
}

function renderQuiz() {
  const q = QUIZ[S.qIdx];
  document.getElementById('quiz-title').textContent = t('quizTitle');
  document.getElementById('quiz-progress').textContent =
    S.lang === 'zh' ? `第 ${S.qIdx + 1} 题，共 5 题` : `question ${S.qIdx + 1} of 5`;
  document.getElementById('quiz-q').textContent = q[S.lang];

  const optsEl = document.getElementById('quiz-opts');
  optsEl.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'quiz-opt' + (S.quizAnswers[S.qIdx] === opt.v ? ' sel' : '');
    btn.textContent = opt[S.lang];
    btn.onclick = () => {
      S.quizAnswers[S.qIdx] = opt.v;
      optsEl.querySelectorAll('.quiz-opt').forEach((b, j) => b.classList.toggle('sel', j === i));
    };
    optsEl.appendChild(btn);
  });

  const backBtn = document.getElementById('quiz-back-btn');
  const nextBtn = document.getElementById('quiz-next-btn');
  backBtn.textContent = t('quizBack');
  nextBtn.textContent = S.qIdx < 4 ? t('quizNext') : (S.lang === 'zh' ? '完成' : 'finish');

  backBtn.style.display = S.qIdx === 0 ? 'none' : '';
  backBtn.onclick = () => { S.qIdx--; renderQuiz(); };
  nextBtn.onclick = () => {
    if (!S.quizAnswers[S.qIdx]) return;
    if (S.qIdx < 4) { S.qIdx++; renderQuiz(); }
    else finishQuiz();
  };
}

function finishQuiz() {
  const arch = calcArchetype(S.quizAnswers);
  S.archetype = arch;
  localStorage.setItem('sh_arch', arch);
  showArchResult(arch);
}

function showArchResult(arch) {
  document.getElementById('view-landing').classList.add('hidden');
  document.getElementById('view-quiz').classList.add('hidden');
  document.getElementById('view-arch-result').classList.remove('hidden');

  const a = ARCHETYPES[arch];
  const al = a[S.lang];
  const recNames = a.recommended.map(d => tDeck(d)).join(', ');

  document.getElementById('arch-result-content').innerHTML = `
    <div class="arch-result-glyph">${a.glyph}</div>
    <div class="arch-result-label">${t('youAre')}</div>
    <div class="arch-result-name">${al.name}</div>
    <div class="arch-result-desc">${al.desc}</div>
    <div class="arch-result-traits">${al.traits.map(tr => `<span class="arch-trait">${tr}</span>`).join('')}</div>
    <div style="font-size:0.65rem;color:var(--shadow);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:24px">${t('archRecommends')}: ${recNames}</div>
    <button class="cta-btn" id="arch-enter-btn">${t('enterDeckNow')}</button>`;

  document.getElementById('arch-enter-btn').onclick = () => showTab('deck');
  document.getElementById('reassess-btn').classList.remove('hidden');
}

// ── DECK ──────────────────────────────────────────────────────────────────────

function renderDeck() {
  const pillsEl = document.getElementById('deck-pills');
  pillsEl.innerHTML = '';
  const deckKeys = Object.keys(CARDS);
  deckKeys.forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'deck-pill' + (S.deck === key ? ' sel' : '');
    btn.textContent = `${DECK_ICONS[key]} ${tDeck(key)}`;
    btn.onclick = () => selectDeck(key);
    pillsEl.appendChild(btn);
  });

  document.getElementById('shuffle-btn').textContent = t('shuffle');
  document.getElementById('deck-prompt').textContent = t('pickPrompt');

  if (S.deck) {
    document.getElementById('deck-table-wrap').classList.remove('hidden');
    renderTable();
  } else {
    document.getElementById('deck-table-wrap').classList.add('hidden');
  }
}

function selectDeck(key) {
  S.deck = key;
  S.picked = [];
  S.readingOpen = false;
  renderDeck();
}

function buildTableLayout() {
  const deck = CARDS[S.deck];
  // 25 cards, cycling through deck cards
  const layout = [];
  for (let i = 0; i < 25; i++) {
    const card = deck[i % deck.length];
    layout.push({
      card,
      rot: rand(-14, 14),
      dy: rand(-18, 18)
    });
  }
  S.tableLayout = layout;
}

function renderTable() {
  if (!S.tableLayout.length || S.tableLayout[0].card.id !== CARDS[S.deck][0].id) {
    buildTableLayout();
  }
  const tableEl = document.getElementById('card-table');
  tableEl.innerHTML = '';
  S.tableLayout.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'mc' + (S.picked.some(p => p._tIdx === i) ? ' picked' : '');
    el.style.setProperty('--rot', item.rot + 'deg');
    el.style.setProperty('--dy', item.dy + 'px');
    el.dataset.idx = i;
    el.onclick = () => pickCard(i, item.card);
    tableEl.appendChild(el);
  });
  renderPickedCards();
}

function pickCard(tIdx, card) {
  const alreadyIdx = S.picked.findIndex(p => p._tIdx === tIdx);
  if (alreadyIdx >= 0) {
    S.picked.splice(alreadyIdx, 1);
  } else {
    if (S.picked.length >= 3) return;
    S.picked.push({ ...card, _tIdx: tIdx });
  }
  S.readingOpen = false;
  renderTable();
}

function renderPickedCards() {
  const row = document.getElementById('picked-row');
  row.innerHTML = S.picked.map((c, i) => renderWcard(c, i)).join('');

  // Flip cards after a short delay
  S.picked.forEach((_, i) => {
    setTimeout(() => {
      const el = document.getElementById('wcard-' + i);
      if (el) el.classList.add('flipped');
    }, 300 + i * 200);
  });

  const revealBtn = document.getElementById('reveal-btn');
  const readingWrap = document.getElementById('reading-wrap');

  if (S.picked.length > 0) {
    revealBtn.classList.remove('hidden');
    revealBtn.textContent = t('revealReading');
    revealBtn.onclick = openReading;
  } else {
    revealBtn.classList.add('hidden');
  }

  if (S.readingOpen) {
    readingWrap.classList.remove('hidden');
    renderReading();
  } else {
    readingWrap.classList.add('hidden');
  }
}

function openReading() {
  S.readingOpen = true;
  document.getElementById('reveal-btn').classList.add('hidden');
  document.getElementById('reading-wrap').classList.remove('hidden');
  renderReading();
}

function renderReading() {
  const cards = S.picked;
  const cl = cards.map(c => cardL(c));
  const l = S.lang;

  let synth;
  if (l === 'zh') {
    synth = cl.length === 1
      ? `${cap(cl[0].name)}确立了今日的方向：${cl[0].sharper}`
      : cl.length === 2
      ? `${cap(cl[0].name)}确立了方向：${cl[0].sharper} ${cap(cl[1].name)}揭示其下的张力：${cl[1].sharper}`
      : `${cap(cl[0].name)}确立了方向：${cl[0].sharper} ${cap(cl[1].name)}揭示其下的张力：${cl[1].sharper} ${cap(cl[2].name)}给出了今晚的问题：${cl[2].sharper}`;
  } else {
    synth = cl.length === 1
      ? `${cap(cl[0].name)} sets the ground for today: ${cl[0].sharper}`
      : cl.length === 2
      ? `${cap(cl[0].name)} sets the ground: ${cl[0].sharper} ${cap(cl[1].name)} reveals the tension beneath: ${cl[1].sharper}`
      : `${cap(cl[0].name)} sets the ground: ${cl[0].sharper} ${cap(cl[1].name)} reveals the tension beneath: ${cl[1].sharper} ${cap(cl[2].name)} closes with the question you carry: ${cl[2].sharper}`;
  }

  const move = cl[0].do;
  const dont = (cl[1] || cl[0]).dont;
  const evening = (cl[2] || cl[1] || cl[0]).evening;

  document.getElementById('reading-wrap').innerHTML = `
    <div class="reading-panel">
      <div class="reading-section">
        <div class="reading-label">${t('conclusionLabel')}</div>
        <div class="reading-text">${synth}</div>
      </div>
      <hr class="reading-divider">
      <div class="reading-section">
        <div class="reading-label">${t('makeThisMove')}</div>
        <div class="reading-action">${move}</div>
      </div>
      <hr class="reading-divider">
      <div class="reading-section">
        <div class="reading-label">${t('doNotFeed')}</div>
        <div class="reading-action">${dont}</div>
      </div>
      <hr class="reading-divider">
      <div class="reading-section">
        <div class="reading-label">${t('eveningQ')}</div>
        <div class="reading-action">${evening}</div>
      </div>
      <button class="save-all-btn" id="save-all-btn">${t('saveAll')}</button>
    </div>`;

  document.getElementById('save-all-btn').onclick = () => {
    S.picked.forEach(c => {
      if (!S.favs.includes(c.id)) S.favs.push(c.id);
    });
    saveFavs();
    document.getElementById('save-all-btn').textContent = t('saveAllDone');
    setTimeout(() => {
      const btn = document.getElementById('save-all-btn');
      if (btn) btn.textContent = t('saveAll');
    }, 2000);
  };
}

// ── ARCHIVE ───────────────────────────────────────────────────────────────────

function renderArchive() {
  document.getElementById('arch-tab-title').textContent = t('archive');
  document.getElementById('clear-btn').textContent = t('clearArchive');
  document.getElementById('clear-btn').onclick = () => {
    S.favs = [];
    saveFavs();
    renderArchive();
  };

  const grid = document.getElementById('archive-grid');
  if (S.favs.length === 0) {
    grid.innerHTML = `<div class="archive-empty">${t('emptyArchive')}</div>`;
    return;
  }

  grid.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'archive-grid';
  S.favs.forEach(id => {
    const card = getCard(id);
    if (!card) return;
    const cardWrap = document.createElement('div');
    cardWrap.className = 'wcard-wrap';
    cardWrap.innerHTML = `
      <div class="wcard flipped">
        <div class="wcard-back"><span class="wcard-back-text">Sharper · wisdom</span></div>
        <div class="wcard-face">${renderCardFace(card)}</div>
      </div>`;
    wrap.appendChild(cardWrap);
  });
  grid.appendChild(wrap);
}

// ── PROXIMITY GLOW ────────────────────────────────────────────────────────────

document.addEventListener('mousemove', e => {
  const mcs = document.querySelectorAll('.mc');
  mcs.forEach(mc => {
    const r = mc.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
    const glow = Math.max(0, 1 - dist / 120);
    mc.style.setProperty('--glow', (glow * glow).toFixed(3));
  });
});

// ── SHUFFLE ───────────────────────────────────────────────────────────────────

document.getElementById('shuffle-btn').onclick = () => {
  S.picked = [];
  S.readingOpen = false;
  buildTableLayout();
  renderTable();
};

// ── LANG TOGGLE ───────────────────────────────────────────────────────────────

document.getElementById('lang-btn').onclick = () => {
  S.lang = S.lang === 'en' ? 'zh' : 'en';
  localStorage.setItem('sh_lang', S.lang);
  document.getElementById('lang-btn').textContent = S.lang === 'en' ? '中文' : 'EN';
  updateNavLabels();
  const activeTab = document.querySelector('.nav-btn.on')?.dataset.tab || 'home';
  showTab(activeTab);
};

function updateNavLabels() {
  document.getElementById('nav-home').textContent = t('home');
  document.getElementById('nav-deck').textContent = t('deck');
  document.getElementById('nav-archive').textContent = t('archive');
  document.getElementById('lang-btn').textContent = S.lang === 'en' ? '中文' : 'EN';
  if (S.archetype) {
    document.getElementById('reassess-btn').textContent = t('reassess');
  }
}

// ── NAV ───────────────────────────────────────────────────────────────────────

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.onclick = () => showTab(btn.dataset.tab);
});
document.getElementById('logo-btn').onclick = () => showTab('home');

document.getElementById('reassess-btn').onclick = startQuiz;

// ── INIT ──────────────────────────────────────────────────────────────────────

updateNavLabels();
renderHome();

</script>
</body>
</html>
