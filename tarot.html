<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sharp · wisdom cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #f0ead8;
  --cream-deep: #e8e0c8;
  --black: #1a1714;
  --gold: #a8831e;
  --gold-light: #c9a84c;
  --gold-pale: #e8d9a8;
  --shadow: #6b5a3e;
  --warm-grey: #8a7d6a;
  --card-face: #f5f0e2;
  --card-back: #1c1814;
  --ink: #2a2318;
  --glow-color: 168, 131, 30;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--cream);
  color: var(--black);
  font-family: 'Space Mono', monospace;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ════════════════════════════════════
   SHARED
════════════════════════════════════ */
.hidden { display: none !important; }

.btn {
  display: inline-block;
  font-family: 'Space Mono', monospace;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: lowercase;
  padding: 0.65rem 1.3rem;
  background: var(--black);
  color: var(--cream);
  border: 2px solid var(--black);
  box-shadow: 4px 4px 0 var(--shadow);
  cursor: pointer;
  transition: box-shadow 0.1s, transform 0.1s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover  { box-shadow: 6px 6px 0 var(--shadow); transform: translate(-1px,-1px); }
.btn:active { box-shadow: 2px 2px 0 var(--shadow); transform: translate(1px,1px); }
.btn-ghost {
  background: transparent;
  color: var(--black);
  box-shadow: 3px 3px 0 var(--black);
  border-color: var(--black);
}
.btn-ghost:hover { box-shadow: 5px 5px 0 var(--black); }
.btn-gold {
  background: var(--gold);
  color: var(--cream);
  border-color: var(--gold);
}
.btn-sm { padding: 0.4rem 0.85rem; font-size: 0.6rem; }

.t-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--warm-grey);
}
.sep { width: 36px; height: 1px; background: var(--gold-pale); margin: 1.2rem 0; }

/* ════════════════════════════════════
   QUIZ + ARCHETYPE SCREENS
════════════════════════════════════ */
.solo-screen {
  display: none;
  min-height: 100vh;
  padding: 2.5rem 1.5rem 4rem;
  max-width: 580px;
  margin: 0 auto;
  animation: fadeUp 0.3s ease both;
}
.solo-screen.active { display: block; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* quiz */
.quiz-progress { display: flex; gap: 0.3rem; margin-bottom: 2rem; }
.quiz-pip { height: 3px; flex: 1; background: var(--cream-deep); transition: background 0.25s; }
.quiz-pip.filled { background: var(--black); }
.quiz-q {
  font-family: 'IM Fell English', serif;
  font-size: 1.35rem;
  line-height: 1.35;
  color: var(--ink);
  margin-bottom: 0.4rem;
}
.quiz-sub {
  font-family: 'Space Mono', monospace;
  font-size: 0.58rem;
  color: var(--warm-grey);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 1.8rem;
}
.quiz-options { display: flex; flex-direction: column; gap: 0.6rem; }
.quiz-opt {
  padding: 0.9rem 1.1rem;
  border: 2px solid var(--cream-deep);
  background: var(--card-face);
  cursor: pointer;
  font-family: 'IM Fell English', serif;
  font-size: 1rem;
  line-height: 1.4;
  box-shadow: 3px 3px 0 transparent;
  transition: border-color 0.12s, box-shadow 0.12s, background 0.12s;
}
.quiz-opt:hover { border-color: var(--black); box-shadow: 3px 3px 0 var(--black); }
.quiz-opt.selected { border-color: var(--black); background: var(--black); color: var(--cream); box-shadow: 3px 3px 0 var(--shadow); }

/* archetype */
.arch-reveal {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 2.5rem 0;
  gap: 1rem;
}
.arch-glyph {
  font-size: 4rem;
  color: var(--gold);
  font-family: monospace;
  line-height: 1;
  margin-bottom: 0.3rem;
}
.arch-badge {
  font-family: 'Space Mono', monospace;
  font-size: 0.58rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--warm-grey);
  background: var(--cream-deep);
  padding: 0.25rem 0.7rem;
}
.arch-name {
  font-family: 'IM Fell English', serif;
  font-size: 2.1rem;
  color: var(--ink);
}
.arch-desc {
  font-family: 'IM Fell English', serif;
  font-size: 1rem;
  line-height: 1.6;
  color: var(--warm-grey);
  max-width: 360px;
  font-style: italic;
}
.arch-traits {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  justify-content: center;
}
.trait-chip {
  font-family: 'Space Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.2rem 0.55rem;
  border: 1.5px solid var(--gold);
  color: var(--gold);
}

/* ════════════════════════════════════
   MAIN APP SHELL
════════════════════════════════════ */
#app {
  display: none;
  max-width: 720px;
  margin: 0 auto;
  padding: 0 0 5rem;
}
#app.active { display: block; }

/* ── top bar ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--gold-pale);
  position: sticky;
  top: 0;
  background: var(--cream);
  z-index: 50;
}
.topbar-logo {
  font-family: 'Space Mono', monospace;
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--ink);
}
.topbar-logo span { color: var(--gold); }
.arch-pill {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-family: 'Space Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.08em;
  text-transform: lowercase;
  color: var(--warm-grey);
  cursor: pointer;
  padding: 0.25rem 0.5rem;
  border: 1px solid var(--cream-deep);
  transition: border-color 0.12s;
}
.arch-pill:hover { border-color: var(--warm-grey); }
.arch-pill-glyph { color: var(--gold); font-size: 0.9rem; font-family: monospace; }
.arch-pill-reassess {
  font-size: 0.48rem;
  opacity: 0.5;
  margin-left: 0.2rem;
}

/* ── tabs ── */
.tabs {
  display: flex;
  gap: 0;
  border-bottom: 2px solid var(--cream-deep);
  padding: 0 1.5rem;
}
.tab-btn {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: lowercase;
  padding: 0.8rem 1.2rem 0.7rem;
  background: none;
  border: none;
  border-bottom: 2.5px solid transparent;
  margin-bottom: -2px;
  cursor: pointer;
  color: var(--warm-grey);
  transition: color 0.12s, border-color 0.12s;
}
.tab-btn:hover { color: var(--ink); }
.tab-btn.active { color: var(--ink); border-bottom-color: var(--black); }

/* ── tab panels ── */
.tab-panel { display: none; padding: 1.5rem 1.5rem 2rem; animation: fadeUp 0.25s ease both; }
.tab-panel.active { display: block; }

/* ════════════════════════════════════
   DRAW TAB
════════════════════════════════════ */

/* deck pills */
.deck-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 1.2rem;
}
.deck-pill {
  font-family: 'Space Mono', monospace;
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: lowercase;
  padding: 0.35rem 0.7rem;
  border: 2px solid var(--cream-deep);
  background: var(--card-face);
  cursor: pointer;
  transition: all 0.12s;
  box-shadow: 2px 2px 0 transparent;
}
.deck-pill:hover { border-color: var(--black); box-shadow: 2px 2px 0 var(--black); }
.deck-pill.on {
  background: var(--black);
  color: var(--cream);
  border-color: var(--black);
  box-shadow: 2px 2px 0 var(--shadow);
}
.deck-pill .di { color: var(--gold-light); margin-right: 0.2rem; }
.deck-pill.on .di { color: var(--gold-light); }

.draw-hint-text {
  font-family: 'Space Mono', monospace;
  font-size: 0.58rem;
  color: var(--warm-grey);
  letter-spacing: 0.06em;
  margin-bottom: 1.8rem;
}

/* ── card grid ── */
.grid-section { position: relative; }
.grid-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--warm-grey);
  margin-bottom: 1rem;
}
.card-grid-wrap {
  position: relative;
  padding: 1.2rem 0.5rem 1.5rem;
  margin: 0 -0.5rem;
  cursor: none; /* hide default cursor in grid */
}

/* custom cursor dot */
.grid-cursor {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gold);
  pointer-events: none;
  transform: translate(-50%, -50%);
  transition: opacity 0.2s;
  opacity: 0;
  z-index: 10;
  box-shadow: 0 0 12px 4px rgba(var(--glow-color), 0.4);
}

.card-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 0.5rem 0.8rem;
  justify-content: center;
}

/* mini card */
.mini-card {
  --rot: 0deg;
  --dy: 0px;
  --glow: 0;
  width: 52px;
  height: 82px;
  background: var(--card-back);
  border: 1.5px solid #3a3028;
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  transform: rotate(var(--rot)) translateY(var(--dy));
  box-shadow:
    2px 2px 0 #0a0806,
    0 0 calc(var(--glow) * 22px) calc(var(--glow) * 3px)
      rgba(var(--glow-color), calc(var(--glow) * 0.85));
  transition:
    transform 0.12s ease,
    box-shadow 0.06s ease,
    opacity 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.mini-card::before {
  content: '';
  position: absolute;
  inset: 3px;
  border: 1px solid #3a3028;
  opacity: 0.4;
}
.mini-card-inner-glyph {
  font-size: 1.1rem;
  color: var(--gold);
  opacity: calc(0.18 + var(--glow) * 0.5);
  font-family: monospace;
  pointer-events: none;
  transition: opacity 0.08s;
}
.mini-card.taken {
  opacity: 0.18;
  pointer-events: none;
  transform: rotate(var(--rot)) translateY(var(--dy)) scale(0.92);
}
.mini-card.exhausted {
  opacity: 0.12;
  pointer-events: none;
}

/* ── pulled cards ── */
.pulled-section {
  margin-top: 2rem;
  padding-top: 1rem;
  border-top: 1px solid var(--gold-pale);
}
.pulled-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--warm-grey);
  margin-bottom: 1.2rem;
}
.pulled-spread {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  justify-content: center;
}

/* ── tarot card (full size) ── */
.tarot-card {
  width: 170px;
  height: 280px;
  perspective: 900px;
  flex-shrink: 0;
}
.tarot-card-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.4,0.2,0.2,1);
}
.tarot-card.flipped .tarot-card-inner { transform: rotateY(180deg); }
.card-face, .card-back-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border: 2.5px solid var(--black);
  box-shadow: 5px 5px 0 var(--shadow);
}

/* card back */
.card-back-face {
  background: var(--card-back);
  display: flex;
  align-items: center;
  justify-content: center;
}
.cb-inner {
  width: 80%;
  height: 82%;
  border: 1px solid #3a3228;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}
.cb-glyph { color: var(--gold); font-size: 1.6rem; font-family: monospace; opacity: 0.6; }
.cb-text {
  font-family: 'Space Mono', monospace;
  font-size: 0.44rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #4a4030;
}

/* card face */
.card-face {
  background: var(--card-face);
  transform: rotateY(180deg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.cf-top {
  padding: 0.8rem 0.8rem 0.5rem;
  border-bottom: 1px solid var(--cream-deep);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
}
.cf-deck {
  font-family: 'Space Mono', monospace;
  font-size: 0.42rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--warm-grey);
}
.cf-icon {
  font-size: 2rem;
  line-height: 1;
  color: var(--gold);
  font-family: monospace;
  margin: 0.3rem 0;
}
.cf-name {
  font-family: 'Space Mono', monospace;
  font-size: 0.54rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: lowercase;
  text-align: center;
  color: var(--ink);
}
.cf-body {
  flex: 1;
  padding: 0.7rem 0.7rem 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
  scrollbar-width: none;
}
.cf-body::-webkit-scrollbar { display: none; }
.cf-quote {
  font-family: 'IM Fell English', serif;
  font-size: 0.68rem;
  font-style: italic;
  line-height: 1.45;
  color: var(--warm-grey);
}
.cf-attr {
  font-family: 'Space Mono', monospace;
  font-size: 0.4rem;
  color: var(--warm-grey);
  opacity: 0.65;
  letter-spacing: 0.04em;
}
.cf-div { width: 20px; height: 1px; background: var(--gold-pale); }
.cf-sharper {
  font-family: 'IM Fell English', serif;
  font-size: 0.75rem;
  line-height: 1.5;
  color: var(--ink);
}
.cf-after { height: 1.8rem; flex-shrink: 0; }
.cf-footer {
  padding: 0.3rem 0.6rem 0.5rem;
  display: flex;
  justify-content: flex-end;
  background: linear-gradient(to bottom, transparent 0%, var(--card-face) 60%);
  margin-top: -1.4rem;
  position: relative;
  z-index: 1;
}
.fav-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 0.8rem;
  color: var(--warm-grey);
  padding: 0.15rem;
  transition: color 0.12s, transform 0.12s;
  font-family: monospace;
  pointer-events: all;
}
.fav-btn:hover { color: var(--gold); transform: scale(1.2); }
.fav-btn.on { color: var(--gold); }

/* ── reading panel ── */
.reading-wrap { margin-top: 2rem; }
.reading-unlock-btn {
  width: 100%;
  text-align: center;
  padding: 0.9rem;
  background: var(--black);
  color: var(--cream);
  font-family: 'Space Mono', monospace;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: lowercase;
  border: 2px solid var(--black);
  box-shadow: 4px 4px 0 var(--shadow);
  cursor: pointer;
  transition: box-shadow 0.1s, transform 0.1s;
}
.reading-unlock-btn:hover { box-shadow: 6px 6px 0 var(--shadow); transform: translate(-1px,-1px); }
.reading-panel {
  background: var(--black);
  color: var(--cream);
  padding: 1.8rem;
  border: 2px solid var(--black);
  box-shadow: 6px 6px 0 var(--shadow);
  margin-top: 0.8rem;
}
.rp-header {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid #3a3228;
  margin-bottom: 1.2rem;
}
.rp-glyph { font-size: 1.3rem; color: var(--gold); font-family: monospace; }
.rp-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--warm-grey);
}
.rp-title { font-family: 'IM Fell English', serif; font-size: 1.1rem; color: var(--cream); margin-top: 0.1rem; }
.rp-synth {
  font-family: 'IM Fell English', serif;
  font-size: 0.9rem;
  line-height: 1.65;
  color: #c8beae;
  font-style: italic;
  margin-bottom: 1.3rem;
}
.rp-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
.rp-col-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.52rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 0.7rem;
}
.rp-col-label.do { color: #7ab88a; }
.rp-col-label.dont { color: #c27a7a; }
.rp-list { list-style: none; display: flex; flex-direction: column; gap: 0.65rem; }
.rp-list li {
  font-family: 'IM Fell English', serif;
  font-size: 0.84rem;
  line-height: 1.4;
  color: #c8beae;
  padding-left: 0.9rem;
  position: relative;
}
.rp-list.do li::before { content: '▸'; position: absolute; left: 0; color: #7ab88a; font-size: 0.65rem; top: 0.1rem; }
.rp-list.dont li::before { content: '▸'; position: absolute; left: 0; color: #c27a7a; font-size: 0.65rem; top: 0.1rem; }
.rp-cards-used {
  margin-top: 1rem;
  padding-top: 0.7rem;
  border-top: 1px solid #3a3228;
  font-family: 'Space Mono', monospace;
  font-size: 0.46rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #3a3228;
}
.new-draw-btn {
  width: 100%;
  margin-top: 0.8rem;
  padding: 0.7rem;
  background: transparent;
  color: var(--warm-grey);
  border: 1.5px solid #3a3228;
  font-family: 'Space Mono', monospace;
  font-size: 0.58rem;
  letter-spacing: 0.1em;
  text-transform: lowercase;
  cursor: pointer;
  transition: color 0.12s, border-color 0.12s;
}
.new-draw-btn:hover { color: var(--cream); border-color: var(--warm-grey); }

/* ════════════════════════════════════
   SAVED TAB
════════════════════════════════════ */
.favs-empty { text-align: center; padding: 4rem 2rem; color: var(--warm-grey); }
.favs-empty-icon { font-size: 2rem; color: var(--gold-pale); font-family: monospace; margin-bottom: 0.8rem; }
.favs-grid { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: flex-start; margin-top: 1.2rem; }

/* ════════════════════════════════════
   RESPONSIVE
════════════════════════════════════ */
@media (max-width: 400px) {
  .mini-card { width: 44px; height: 70px; }
  .tarot-card { width: 148px; height: 248px; }
  .rp-cols { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ════════════════════════════════════
     QUIZ SCREEN
════════════════════════════════════ -->
<div id="screen-quiz" class="solo-screen active">
  <div style="padding: 1.5rem 0 2.5rem; display:flex; justify-content:space-between; align-items:center;">
    <div style="font-family:'Space Mono',monospace;font-size:0.9rem;font-weight:700;color:var(--ink)">sh<span style="color:var(--gold)">◈</span>rp</div>
    <div class="t-label">archetype quiz</div>
  </div>
  <div class="quiz-progress" id="quiz-progress">
    <div class="quiz-pip" id="pip-0"></div>
    <div class="quiz-pip" id="pip-1"></div>
    <div class="quiz-pip" id="pip-2"></div>
    <div class="quiz-pip" id="pip-3"></div>
    <div class="quiz-pip" id="pip-4"></div>
  </div>
  <div class="t-label" style="margin-bottom:0.8rem">question <span id="quiz-counter">1</span> of 5</div>
  <div class="quiz-q" id="quiz-question"></div>
  <div class="quiz-sub" id="quiz-sub"></div>
  <div class="quiz-options" id="quiz-options"></div>
  <div style="margin-top:1.5rem">
    <button class="btn btn-ghost btn-sm" onclick="quizBack()" id="quiz-back-btn" style="display:none">← prev</button>
  </div>
</div>

<!-- ════════════════════════════════════
     ARCHETYPE REVEAL
════════════════════════════════════ -->
<div id="screen-archetype" class="solo-screen">
  <div id="arch-content" class="arch-reveal"></div>
  <div style="text-align:center; margin-top:1.5rem">
    <button class="btn" onclick="enterApp()">enter the deck →</button>
  </div>
</div>

<!-- ════════════════════════════════════
     MAIN APP
════════════════════════════════════ -->
<div id="app">

  <!-- top bar -->
  <div class="topbar">

        donts:['wait to be discovered — go where the opportunities are','attribute success entirely to skill or entirely to luck — it\'s both','mistake preparation for prediction'] },
      { id:'ph6', name:'the cave', icon:'◧',
        quote:'We can easily forgive a child who is afraid of the dark; the real tragedy is when men are afraid of the light.',
        attr:'attributed to Plato · c. 380 BC',
        sharper:'the comfortable story is rarely the accurate one. the truth that makes you uncomfortable is usually the one worth sitting with.',
        dos:['pursue the uncomfortable truth over the comfortable explanation','ask: what am I not letting myself see here?','build a tolerance for cognitive discomfort — it\'s the signal of real learning'],
        donts:['choose the explanation that protects your current worldview','mistake comfort for correctness','avoid the question that might require you to change'] },
      { id:'ph7', name:'the stage', icon:'□',
        quote:'Act well your part; there all the honor lies.',
        attr:'Alexander Pope · An Essay on Man · c. 1733',
        sharper:'your role doesn\'t diminish you. how you show up within it does. bring full presence to the smaller stages — that\'s where character is built.',
        dos:['bring your full self to small moments as well as large ones','find meaning in the role you\'re in now, not the one you want','let how you do anything speak for how you do everything'],
        donts:['save your best for an audience','treat mundane responsibilities as beneath your real potential','defer presence to the important-seeming moments'] },
      { id:'ph8', name:'the whole', icon:'⊙',
        quote:'The whole is more than the sum of its parts.',
        attr:'Aristotle · Metaphysics · c. 350 BC',
        sharper:'you are not your function. you are not your title. what persists across all your roles is the self worth knowing.',
        dos:['tend to the self that exists across all contexts','notice what doesn\'t change about you regardless of role','invest in who you are, not just what you do'],
        donts:['let a title or role become your whole identity','reduce yourself to your usefulness','neglect the integrated self in favour of the performing self'] }
    ]
  }
];

// ════════════════════════════════════
//  STATE
// ════════════════════════════════════

const state = {
  archetype: null,
  quizAnswers: {},
  currentQ: 0,
  selectedDecks: new Set(),
  tableCards: [],      // 25-card pool currently on the table
  pickedCards: [],     // up to 3 chosen cards
  favorites: new Set(JSON.parse(localStorage.getItem('sharp_favs') || '[]')),
  readingDone: false
};

function saveFavs() {
  localStorage.setItem('sharp_favs', JSON.stringify([...state.favorites]));
}

function loadArchetype() {
  const saved = localStorage.getItem('sharp_archetype');
  if (saved) {
    try { return JSON.parse(saved); } catch(e) { return null; }
  }
  return null;
}

function saveArchetype(a) {
  localStorage.setItem('sharp_archetype', JSON.stringify(a));
}

// ════════════════════════════════════
//  BOOT
// ════════════════════════════════════

(function boot() {
  const saved = loadArchetype();
  if (saved) {
    state.archetype = saved;
    enterApp();
  } else {
    showScreen('quiz');
    renderQuestion();
  }
})();

function showScreen(id) {
  document.querySelectorAll('.solo-screen').forEach(s => s.classList.remove('active'));
  document.getElementById('app').classList.remove('active');
  if (id === 'app') {
    document.getElementById('app').classList.add('active');
  } else {
    const el = document.getElementById('screen-' + id);
    if (el) el.classList.add('active');
  }
  window.scrollTo(0, 0);
}

function enterApp() {
  updateArchPill();
  initDeckPills();
  showScreen('app');
}

// ════════════════════════════════════
//  QUIZ
// ════════════════════════════════════

function renderQuestion() {
  const q = QUIZ[state.currentQ];
  document.getElementById('quiz-question').textContent = q.q;
  document.getElementById('quiz-sub').textContent = q.sub;
  document.getElementById('quiz-counter').textContent = state.currentQ + 1;
  document.getElementById('quiz-back-btn').style.display = state.currentQ > 0 ? 'inline-block' : 'none';
  for (let i = 0; i < 5; i++) {
    document.getElementById('pip-' + i).className = 'quiz-pip' + (i <= state.currentQ ? ' filled' : '');
  }
  const opts = document.getElementById('quiz-options');
  opts.innerHTML = '';
  q.opts.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'quiz-opt' + (state.quizAnswers[state.currentQ] === opt.arch ? ' selected' : '');
    div.textContent = opt.text;
    div.onclick = () => selectAnswer(opt.arch, idx);
    opts.appendChild(div);
  });
}

function selectAnswer(arch, idx) {
  state.quizAnswers[state.currentQ] = arch;
  document.querySelectorAll('.quiz-opt').forEach((o, i) => o.classList.toggle('selected', i === idx));
  setTimeout(() => {
    if (state.currentQ < QUIZ.length - 1) {
      state.currentQ++;
      renderQuestion();
    } else {
      resolveArchetype();
    }
  }, 270);
}

function quizBack() {
  if (state.currentQ > 0) { state.currentQ--; renderQuestion(); }
}

function resolveArchetype() {
  const scores = {};
  Object.values(state.quizAnswers).forEach(a => { scores[a] = (scores[a] || 0) + 1; });
  const top = Object.entries(scores).sort((a,b) => b[1]-a[1])[0][0];
  state.archetype = ARCHETYPES[top] || ARCHETYPES.wanderer;
  saveArchetype(state.archetype);

  const c = document.getElementById('arch-content');
  c.innerHTML = `
    <div class="arch-glyph">${state.archetype.glyph}</div>
    <div class="arch-badge">your archetype</div>
    <div class="arch-name">${state.archetype.name}</div>
    <div style="width:36px;height:1px;background:var(--gold-pale);margin:0.3rem auto"></div>
    <div class="arch-desc">${state.archetype.desc}</div>
    <div class="arch-traits">${state.archetype.traits.map(t=>`<span class="trait-chip">${t}</span>`).join('')}</div>
  `;
  showScreen('archetype');
}

function reassessPrompt() {
  if (confirm('retake the archetype quiz? your current archetype will be replaced.')) {
    localStorage.removeItem('sharp_archetype');
    state.archetype = null;
    state.quizAnswers = {};
    state.currentQ = 0;
    showScreen('quiz');
    renderQuestion();
  }
}

// ════════════════════════════════════
//  APP SHELL
// ════════════════════════════════════

function updateArchPill() {
  if (!state.archetype) return;
  document.getElementById('ap-glyph').textContent = state.archetype.glyph;
  document.getElementById('ap-name').textContent = state.archetype.name;
}

function switchTab(id, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + id).classList.add('active');
  if (id === 'saved') renderFavs();
}

// ════════════════════════════════════
//  DECK PILLS
// ════════════════════════════════════

function initDeckPills() {
  const container = document.getElementById('deck-pills');
  container.innerHTML = '';
  const recommended = state.archetype ? state.archetype.recommended : [];
  DECKS.forEach(deck => {
    const btn = document.createElement('button');
    const isRec = recommended.includes(deck.id);
    btn.className = 'deck-pill' + (state.selectedDecks.has(deck.id) ? ' on' : '');
    btn.innerHTML = `<span class="di">${deck.icon}</span>${deck.name}${isRec ? ' ·✦' : ''}`;
    btn.onclick = () => toggleDeckPill(deck.id, btn);
    container.appendChild(btn);
  });
}

function toggleDeckPill(id, btn) {
  if (state.selectedDecks.has(id)) {
    state.selectedDecks.delete(id);
    btn.classList.remove('on');
  } else {
    state.selectedDecks.add(id);
    btn.classList.add('on');
  }
  rebuildTable();
}

// ════════════════════════════════════
//  CARD TABLE (organic grid)
// ════════════════════════════════════

function rebuildTable() {
  const pool = DECKS.filter(d => state.selectedDecks.has(d.id)).flatMap(d => d.cards);
  const hint = document.getElementById('draw-hint-text');

  if (pool.length === 0) {
    document.getElementById('grid-section').style.display = 'none';
    hint.textContent = 'pick one or more decks, then choose your cards below';
    return;
  }

  // shuffle and take up to 25
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  state.tableCards = shuffled.slice(0, 25);
  state.pickedCards = [];
  state.readingDone = false;

  document.getElementById('grid-pool-label').textContent = `${state.tableCards.length} cards on the table`;
  hint.textContent = `${state.tableCards.length} cards spread · pick up to 3`;
  document.getElementById('grid-section').style.display = 'block';
  document.getElementById('pulled-section').classList.add('hidden');
  document.getElementById('reading-wrap').style.display = 'none';
  document.getElementById('reading-output').innerHTML = '';

  renderGrid();
}

function rnd(min, max) { return Math.random() * (max - min) + min; }

function renderGrid() {
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';

  state.tableCards.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'mini-card';
    el.id = 'mini-' + card.id;
    const rot = rnd(-7, 7).toFixed(1);
    const dy = rnd(-4, 4).toFixed(1);
    el.style.setProperty('--rot', rot + 'deg');
    el.style.setProperty('--dy', dy + 'px');
    el.style.setProperty('--glow', '0');
    el.innerHTML = `<span class="mini-card-inner-glyph">${card.icon}</span>`;
    el.onclick = () => pickCard(card, el);
    grid.appendChild(el);
  });

  setupProximityEffect();
}

function setupProximityEffect() {
  const wrap = document.getElementById('card-grid-wrap');
  const cursor = document.getElementById('grid-cursor');
  const RADIUS = 110;

  wrap.addEventListener('mousemove', (e) => {
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    cursor.style.left = mx + 'px';
    cursor.style.top = my + 'px';
    cursor.style.opacity = '1';

    document.querySelectorAll('.mini-card:not(.taken):not(.exhausted)').forEach(card => {
      const cr = card.getBoundingClientRect();
      const cx = cr.left - rect.left + cr.width / 2;
      const cy = cr.top - rect.top + cr.height / 2;
      const dist = Math.sqrt((mx - cx) ** 2 + (my - cy) ** 2);
      const prox = Math.max(0, 1 - dist / RADIUS);
      const eased = prox * prox; // ease-in for more natural falloff
      card.style.setProperty('--glow', eased.toFixed(3));
    });
  });

  wrap.addEventListener('mouseleave', () => {
    cursor.style.opacity = '0';
    document.querySelectorAll('.mini-card').forEach(card => {
      card.style.setProperty('--glow', '0');
    });
  });
}

// ════════════════════════════════════
//  PICK INTERACTION
// ════════════════════════════════════

function pickCard(card, miniEl) {
  if (state.pickedCards.length >= 3) return;
  if (state.pickedCards.find(c => c.id === card.id)) return;

  state.pickedCards.push(card);
  miniEl.classList.add('taken');

  // show pulled section
  const pulled = document.getElementById('pulled-section');
  pulled.classList.remove('hidden');
  document.getElementById('pulled-label').textContent =
    `${state.pickedCards.length} card${state.pickedCards.length !== 1 ? 's' : ''} drawn · ${3 - state.pickedCards.length} remaining`;

  // append full card (face down first, then flip)
  const spread = document.getElementById('pulled-spread');
  const cardEl = buildFullCard(card);
  cardEl.style.opacity = '0';
  cardEl.style.transform = 'translateY(20px)';
  spread.appendChild(cardEl);

  requestAnimationFrame(() => {
    cardEl.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
    cardEl.style.opacity = '1';
    cardEl.style.transform = 'translateY(0)';
    setTimeout(() => {
      cardEl.classList.add('flipped');
    }, 350);
  });

  // exhaust remaining cards if 3 picked
  if (state.pickedCards.length >= 3) {
    document.querySelectorAll('.mini-card:not(.taken)').forEach(m => m.classList.add('exhausted'));
    document.getElementById('pulled-label').textContent = '3 cards drawn · spread complete';
    setTimeout(() => {
      document.getElementById('reading-wrap').style.display = 'block';
      document.getElementById('reading-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 900);
  }
}

// ════════════════════════════════════
//  FULL CARD
// ════════════════════════════════════

function getDeckName(cardId) {
  const d = DECKS.find(d => d.cards.some(c => c.id === cardId));
  return d ? d.name : '';
}

function buildFullCard(card) {
  const wrap = document.createElement('div');
  wrap.className = 'tarot-card';
  wrap.innerHTML = `
    <div class="tarot-card-inner">
      <div class="card-back-face">
        <div class="cb-inner">
          <div class="cb-glyph">◈</div>
          <div class="cb-text">sharp · wisdom</div>
        </div>
      </div>
      <div class="card-face">
        <div class="cf-top">
          <div class="cf-deck">${getDeckName(card.id)}</div>
          <div class="cf-icon">${card.icon}</div>
          <div class="cf-name">${card.name}</div>
        </div>
        <div class="cf-body">
          <div class="cf-quote">"${card.quote}"</div>
          <div class="cf-attr">${card.attr}</div>
          <div class="cf-div"></div>
          <div class="cf-sharper">${card.sharper}</div>
          <div class="cf-after"></div>
        </div>
        <div class="cf-footer">
          <button class="fav-btn ${state.favorites.has(card.id) ? 'on' : ''}"
            onclick="toggleFav('${card.id}', event)">
            ${state.favorites.has(card.id) ? '★' : '☆'}
          </button>
        </div>
      </div>
    </div>`;
  return wrap;
}

// ════════════════════════════════════
//  RESET DRAW
// ════════════════════════════════════

function resetDraw() {
  rebuildTable();
  document.getElementById('pulled-spread').innerHTML = '';
  document.getElementById('pulled-section').classList.add('hidden');
  document.getElementById('reading-wrap').style.display = 'none';
  document.getElementById('reading-output').innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ════════════════════════════════════
//  FAVORITES
// ════════════════════════════════════

function toggleFav(cardId, event) {
  event.stopPropagation();
  const btn = event.currentTarget;
  if (state.favorites.has(cardId)) {
    state.favorites.delete(cardId);
    btn.textContent = '☆';
    btn.classList.remove('on');
  } else {
    state.favorites.add(cardId);
    btn.textContent = '★';
    btn.classList.add('on');
  }
  saveFavs();
}

function renderFavs() {
  const el = document.getElementById('favs-content');
  if (state.favorites.size === 0) {
    el.innerHTML = `<div class="favs-empty"><div class="favs-empty-icon">☆</div><div class="t-label">no saved cards yet</div><div style="margin-top:0.4rem;font-family:'Space Mono',monospace;font-size:0.58rem;color:var(--warm-grey)">draw cards and tap ☆ to save them here</div></div>`;
    return;
  }
  const allCards = DECKS.flatMap(d => d.cards);
  const favCards = allCards.filter(c => state.favorites.has(c.id));
  el.innerHTML = `<div class="t-label" style="margin-bottom:1rem">${favCards.length} card${favCards.length !== 1 ? 's' : ''} saved</div>`;
  const grid = document.createElement('div');
  grid.className = 'favs-grid';
  favCards.forEach(card => {
    const w = buildFullCard(card);
    w.classList.add('flipped');
    grid.appendChild(w);
  });
  el.appendChild(grid);
}

// ════════════════════════════════════
//  READING
// ════════════════════════════════════

function generateReading() {
  if (state.readingDone) return;
  state.readingDone = true;

  const cards = state.pickedCards;
  const archName = state.archetype ? state.archetype.name : 'the seeker';
  const pick = (arr, n) => [...arr].sort(() => Math.random() - 0.5).slice(0, n);
  const dos = pick(cards.flatMap(c => c.dos), 3);
  const donts = pick(cards.flatMap(c => c.donts), 3);
  const themes = cards.map(c => c.sharper.split('.')[0].trim());

  let synth;
  if (cards.length === 1) synth = `one card today. ${themes[0]}. that's enough — sit with it.`;
  else if (cards.length === 2) synth = `two cards, one thread: ${themes[0]}. and underneath that — ${themes[1]}. they're in conversation.`;
  else synth = `three cards, one undercurrent: ${themes[0]}. then: ${themes[1]}. the third adds texture — ${themes[2]}. your reading is an invitation, not a verdict.`;

  document.getElementById('reading-output').innerHTML = `
    <div class="reading-panel">
      <div class="rp-header">
        <div class="rp-glyph">✦</div>
        <div>
          <div class="rp-label">reading of the day · ${archName}</div>
          <div class="rp-title">what this draw is pointing at</div>
        </div>
      </div>
      <div class="rp-synth">${synth}</div>
      <div class="rp-cols">
        <div>
          <div class="rp-col-label do">three do's</div>
          <ul class="rp-list do">${dos.map(d=>`<li>${d}</li>`).join('')}</ul>
        </div>
        <div>
          <div class="rp-col-label dont">three don'ts</div>
          <ul class="rp-list dont">${donts.map(d=>`<li>${d}</li>`).join('')}</ul>
        </div>
      </div>
      <div class="rp-cards-used">cards drawn · ${cards.map(c=>c.name).join(' · ')}</div>
      <button class="new-draw-btn" onclick="resetDraw()">↺ draw again from the same decks</button>
    </div>`;

  setTimeout(() => {
    document.getElementById('reading-output').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}
</script>
